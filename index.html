<title>Hjältegeneratorn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: ett rollformulär på pergament i nattens bläck; steg 1 smider hjälten, steg 2 tar hen ner i grottan där en djupstege visar vägen till bossen. */
:root{
  --bg:#14110d; --surface:#1d1915; --card:#25201a; --line:#3b3329;
  --ink:#efe6d0; --muted:#a8997d; --blood:#d23a2f; --blood-ink:#fff4ec;
  --gold:#dcaa4b; --good:#7fb36f; --magic:#8fa8e0; --track:#100d0a;
  --f-display:"Pirata One",Georgia,serif;
  --f-body:"Alegreya Sans","Gill Sans","Trebuchet MS",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#e8dfca; --surface:#f2ecdc; --card:#fbf7ec; --line:#cdbe9c;
  --ink:#2a2016; --muted:#6c5d45; --blood:#a5241d; --blood-ink:#fff6ee;
  --gold:#8d6312; --good:#3f7a33; --magic:#3c5aa8; --track:#ddd2b8; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#e8dfca; --surface:#f2ecdc; --card:#fbf7ec; --line:#cdbe9c;
  --ink:#2a2016; --muted:#6c5d45; --blood:#a5241d; --blood-ink:#fff6ee;
  --gold:#8d6312; --good:#3f7a33; --magic:#3c5aa8; --track:#ddd2b8; color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px;
  background-image:radial-gradient(ellipse 80% 36% at 50% 0%,color-mix(in srgb,var(--gold) 9%,transparent),transparent 70%)}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:22px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1;text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
header h1{font-size:clamp(42px,7vw,72px)}
.tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tabs button{border:0;background:var(--surface);padding:10px 16px;cursor:pointer;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center}
.tabs button .n{font-family:var(--f-mono);font-size:12px;border:1px solid currentColor;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 13px;cursor:pointer;font-weight:700;font-size:15px}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--blood);border-color:var(--blood);color:var(--blood-ink);padding:12px 22px;font-size:17px}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.magic{border-color:color-mix(in srgb,var(--magic) 55%,var(--line))}
.btn small{display:block;font-weight:500;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.btn.primary small{color:inherit;opacity:.8}

.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;position:relative;
  box-shadow:0 1px 0 color-mix(in srgb,var(--gold) 18%,transparent) inset,0 18px 40px -24px rgba(0,0,0,.6)}
.sheet::before{content:"";position:absolute;inset:7px;border:1px solid color-mix(in srgb,var(--gold) 22%,transparent);border-radius:3px;pointer-events:none}

/* Generator */
.gen{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
.gen-main{display:grid;gap:20px}
.namebar{display:grid;gap:8px}
.namebar .row{display:flex;gap:8px;flex-wrap:wrap}
.namebar input{flex:1;min-width:0;background:transparent;border:0;border-bottom:2px solid var(--line);font-family:var(--f-display);font-size:clamp(34px,5vw,48px);line-height:1.1;padding:2px 0}
.namebar input:focus{border-bottom-color:var(--gold);outline:none}
.subline{font-size:18px;font-style:italic;color:var(--muted)}
.choose{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choose label{display:grid;gap:4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.choose select{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px;font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink)}
.abil{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.ab{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:8px 4px 6px;text-align:center;display:grid;gap:2px;position:relative}
.ab.key{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.ab .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ab .val{font-family:var(--f-mono);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.ab .mod{font-family:var(--f-mono);font-size:13px;color:var(--gold)}
.ab .dice{display:flex;gap:2px;justify-content:center;margin-top:4px}
.ab .dice span{font-family:var(--f-mono);font-size:10.5px;width:15px;height:15px;border:1px solid var(--line);border-radius:3px;display:grid;place-items:center}
.ab .dice span.drop{opacity:.4;text-decoration:line-through}
.ab .race{font-family:var(--f-mono);font-size:10.5px;color:var(--good);position:absolute;top:4px;right:6px}
.vitals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.vitals div{background:var(--surface);padding:8px 4px;text-align:center;display:grid}
.vitals b{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.vitals span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.gen-side{display:grid;gap:16px}
.block{display:grid;gap:6px}
.block h3{font-size:24px}
.line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0;font-size:15px}
.line:last-child{border-bottom:0}
.line code{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:right}
.line .sv{display:block;font-size:12px;color:var(--muted)}
.gen-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Äventyr */
.adv{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.status{display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.status .who h2{font-size:32px;overflow-wrap:anywhere}
.meter{display:grid;gap:4px}
.meter .top{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter .top strong{color:var(--ink)}
.bar{height:12px;background:var(--track);border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--good),color-mix(in srgb,var(--good) 70%,var(--gold)));transition:width .45s cubic-bezier(.3,.7,.3,1)}
.bar i.low{background:linear-gradient(90deg,var(--blood),color-mix(in srgb,var(--blood) 70%,var(--gold)))}
.bar.xp i{background:linear-gradient(90deg,var(--gold),color-mix(in srgb,var(--gold) 60%,var(--ink)))}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.minis div{border:1px solid var(--line);border-radius:4px;padding:5px;text-align:center;background:var(--surface)}
.minis b{display:block;font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.minis span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--magic)}
.pips i.on{background:var(--magic)}
.bag{display:grid;gap:3px;font-size:14px}

.scene{display:grid;gap:16px}
.depth{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.depth .step{width:28px;height:28px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--surface)}
.depth .step.done{background:color-mix(in srgb,var(--gold) 25%,var(--surface));color:var(--ink);border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.depth .step.here{border:2px solid var(--gold);color:var(--gold);font-weight:700}
.depth .step.boss{border-radius:4px;width:auto;padding:0 8px;font-family:var(--f-display);font-size:16px;color:var(--blood);border-color:color-mix(in srgb,var(--blood) 55%,var(--line))}
.depth .rule{flex:0 0 10px;height:1px;background:var(--line)}
.stage h2{font-size:clamp(32px,4.4vw,44px);margin-bottom:8px}
.stage p{margin:0 0 10px;max-width:62ch}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:6px}
.door{border:1px solid var(--line);background:var(--surface);border-radius:60px 60px 6px 6px;padding:26px 18px 18px;text-align:center;cursor:pointer;display:grid;gap:6px;justify-items:center;transition:border-color .2s,transform .2s}
.door:hover{border-color:var(--gold);transform:translateY(-2px)}
.door .knob{font-family:var(--f-display);font-size:30px;color:var(--gold);line-height:1}
.door .hint{font-style:italic;font-size:16px}
.door .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.foe{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid color-mix(in srgb,var(--blood) 45%,var(--line));border-radius:4px;padding:12px 14px;background:color-mix(in srgb,var(--blood) 6%,var(--surface));margin-bottom:12px}
.foe .rune{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:30px;color:var(--blood-ink);background:var(--blood)}
.foe h3{font-size:28px}
.foe .meta{font-size:14px;color:var(--muted)}
.foe .nums{font-family:var(--f-mono);font-size:13px;text-align:right;color:var(--muted);white-space:nowrap}
.foe .nums b{color:var(--ink);font-size:16px}
.foe .bar{grid-column:1/-1}
@keyframes hit{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}65%{transform:translateX(4px)}}
.shake{animation:hit .35s ease}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.loot{display:grid;gap:6px;border:1px dashed color-mix(in srgb,var(--gold) 55%,var(--line));border-radius:4px;padding:12px 14px;margin:6px 0 12px}
.loot div{display:flex;justify-content:space-between;gap:10px}
.loot b{color:var(--gold)}
.banner{border:1px solid var(--gold);border-radius:4px;padding:16px;text-align:center;background:color-mix(in srgb,var(--gold) 9%,var(--card));margin-bottom:12px}
.banner .big{font-family:var(--f-display);font-size:38px;line-height:1.05;display:block}
.banner.dead{border-color:var(--blood);background:color-mix(in srgb,var(--blood) 9%,var(--card))}
.levelup{color:var(--gold);font-weight:800}

.log{list-style:none;margin:0;padding:6px 16px 14px;max-height:340px;overflow-y:auto;display:grid;gap:0;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.log li{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);font-size:15.5px}
.log li:last-child{border-bottom:0}
.log li.sep{grid-template-columns:1fr;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding-top:12px;border:0}
.chip{font-family:var(--f-mono);font-size:12.5px;font-weight:600;text-align:center;border:1px solid var(--line);border-radius:3px;padding:1px 0;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.hit{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 40%,var(--line))}
.chip.crit{color:var(--bg);background:var(--gold);border-color:var(--gold)}
.chip.fail{color:var(--blood);border-color:var(--blood)}
.chip.heal{color:var(--good);border-color:var(--good)}
.chip.magic{color:var(--magic);border-color:var(--magic)}
.dmg{color:var(--blood);font-weight:800}
.heal{color:var(--good);font-weight:800}
.you{color:var(--gold)}
.them{text-decoration:underline;text-decoration-color:var(--blood);text-underline-offset:3px}
.log-head{display:flex;justify-content:space-between;align-items:baseline}
.log-head h3{font-size:24px}

footer{text-align:center;font-size:13px;color:var(--muted)}
footer a{color:inherit}
@media (max-width:860px){
  .gen,.adv{grid-template-columns:minmax(0,1fr)}
  .status{position:static}
}
@media (max-width:560px){
  .abil{grid-template-columns:repeat(3,minmax(0,1fr))}
  .choose,.doors{grid-template-columns:minmax(0,1fr)}
  .vitals{grid-template-columns:repeat(2,minmax(0,1fr))}
  .foe{grid-template-columns:48px minmax(0,1fr)}
  .foe .nums{grid-column:1/-1;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">

    <div>
      <div class="eyebrow">D&amp;D 5e · SRD-regler · nivå 1 och uppåt</div>
      <h1>Hjältegeneratorn</h1>

function resetRest(h,long){h.sw=1;h.rage=2;h.breath=1;if(long){h.relent=1;h.loh=5*h.lvl;h.slots=slotsFor(h)}if(h.cls==='warlock')h.slots=slotsFor(h)}
function ac(h){const st=scores(h),dx=mod(st.dex);let v;
  if(h.armor){const a=AR[h.armor];v=a.b+(a.dx?(a.mx!=null?Math.min(dx,a.mx):dx):0)}
  else if(h.cls==='barbarian')v=10+dx+mod(st.con);else if(h.cls==='monk')v=10+dx+mod(st.wis);else if(h.cls==='wizard'||h.cls==='sorcerer')v=13+dx;else v=10+dx;
  return v+(h.shield?2:0)+h.acb}
function wStats(h,wi){const w=W[wi],st=scores(h);let m;
  if(w.r)m=mod(st.dex);else if(w.f||h.cls==='monk')m=Math.max(mod(st.str),mod(st.dex));else m=mod(st.str);
  return{w,name:W_SV[wi]||w.n,hit:prof(h.lvl)+m+h.wb+(h.cls==='ranger'&&w.r?2:0),dice:w.d,dm:m+h.wb,type:w.t,ranged:!!w.r}}
function spellMod(h){return mod(scores(h)[CL[h.cls].sa])}
function spellDice(h,s){if(typeof s.d==='string')return s.d;const keys=Object.keys(s.d).map(Number).sort((a,b)=>a-b);let k=keys[0];for(const x of keys)if(h.lvl>=x)k=x;return s.d[k]}
function sName(i){return S_SV[i]||SP[i].n}

try{const h=JSON.parse(localStorage.getItem('hg-hero')||'null');if(h&&h.v===1&&CL[h.cls]&&RC[h.race])hero=h;const a=JSON.parse(localStorage.getItem('hg-adv')||'null');if(a&&hero&&a.v===1)adv=a;const v=localStorage.getItem('hg-view');if(v==='adv'&&adv)view='adv'}catch(e){}
if(!hero)hero=newHero();

const $view=document.getElementById('view');
function setView(v){view=v;document.getElementById('tabGen').setAttribute('aria-selected',String(v==='gen'));document.getElementById('tabAdv').setAttribute('aria-selected',String(v==='adv'));render();save();window.scrollTo({top:0,behavior:'smooth'})}

        <div class="subline">${RACE_SV[h.race]} ${CLS_SV[h.cls].toLowerCase()} på nivå ${h.lvl}</div>

/* ---------- Äventyr: rum ---------- */
const DEPTH=8;
const HINTS={
  fight:['Du hör klor skrapa mot sten.','Något andas tungt där inne.','Ett morrande ekar i gången.','Det luktar blod och blöt päls.'],
  treasure:['Något glimmar i mörkret.','Du ser ett gammalt kistlock.','Mynt klirrar när vinden drar.'],
  camp:['Det luktar gammal brasa.','En torr nisch med en sovfäll.','Svagt ljus från en glödande härd.'],
  trap:['Golvet ser misstänkt jämnt ut.','Små hål sitter i väggarna.','Det är alldeles för tyst.'],
  well:['Vatten porlar någonstans.','En brunn med blå sken.']
};
function crRange(l,boss){if(boss)return l<=1?[0.5,0.5]:l===2?[1,1]:[l-2,l-1];return [[0.125,0.25],[0.25,0.5],[0.5,1],[1,2]][l-1]||[1,l-2]}
function pickMonster(l,boss){
  let [lo,hi]=crRange(l,boss);
  let pool=M.filter(m=>m.cr>=lo&&m.cr<=hi);
  if(boss){const fav=pool.filter(m=>['dragon','giant','fiend','monstrosity','undead','aberration'].includes(m.t));if(fav.length)pool=fav}
  if(!pool.length)pool=M.filter(m=>m.cr<=hi);
  return pick(pool);
}
function randRoom(){const r=Math.random();return r<.5?'fight':r<.66?'treasure':r<.8?'camp':r<.92?'trap':'well'}
function makeDoors(){if(adv.depth===DEPTH)return null;let a=randRoom(),b=randRoom();let n=0;while(b===a&&n++<5)b=randRoom();return[a,b].map(t=>({t,hint:pick(HINTS[t])}))}
function startAdventure(){
  hero.hp=hero.hpMax;resetRest(hero,true);
  hero.start=JSON.parse(JSON.stringify({...hero,start:undefined}));
  adv={v:1,chapter:1,depth:1,phase:'doors',doors:null,log:[],kills:0,xpGain:0,foe:null,room:null};
  adv.doors=makeDoors();
  log('sep',`Kapitel 1 · Grottan under Kråkberget`);
  log('note',`${you()} tänder en fackla och kliver in i grottan.`,'·');
  save();
}
function you(){return `<b class="you">${esc(hero.name.split(' ')[0])}</b>`}
function them(){return `<b class="them">${esc(adv.foe.m.n)}</b>`}
function log(cls,html,chip,chipCls){adv.log.push({c:cls,h:html,ch:chip,cc:chipCls});if(adv.log.length>160)adv.log.splice(0,adv.log.length-160)}

function enterRoom(t){
  adv.room={t};
  if(adv.depth===DEPTH)t=adv.room.t='boss';
  log('sep',`Djup ${adv.depth} av ${DEPTH}${t==='boss'?' · Bossen':''}`);
  if(t==='fight'||t==='boss'){
    const m=pickMonster(hero.lvl,t==='boss');
    adv.foe={m,hp:m.hp,charged:!!m.sv,first:true};
    log('note',`${t==='boss'?'Grottans härskare reser sig':'Något kliver fram ur mörkret'}: ${them()}, ${SIZE[m.s]} ${TYPE[m.t]||m.t}.`,'!','fail');
    const ini=d(20)+mod(scores(hero).dex),fi=d(20)+mod(m.st[1]);
    log('note',`Initiativ: ${you()} ${ini}, ${them()} ${fi}.`,'INI');
    adv.phase='fight';adv.rage=false;
    if(fi>ini){log('note',`${them()} hinner först!`,'·');monsterTurn()}
  }else if(t==='treasure'){
    const items=rollLoot();adv.room.loot=items;adv.phase='room';
    log('note',`${you()} hittar en skattkista.`,'¤','heal');
  }else if(t==='camp'){adv.phase='room';log('note',`En trygg lägerplats. Här kan man vila en stund.`,'·')}
  else if(t==='trap'){
    const dc=10+Math.floor(adv.depth/2)+adv.chapter;const r=d(20),tot=r+mod(scores(hero).dex);
    if(tot>=dc){log('',`Plattor klickar under fötterna! ${you()} kastar sig undan: <span class="muted">${r}${sgn(mod(scores(hero).dex))} = ${tot} mot ${dc}</span>. Klarade det!`,r,'hit')}
    else{const dm=roll(`${Math.max(1,hero.lvl)}d6`);hurtHero(dm);log('',`Spjut skjuter ut ur väggen! ${you()} hinner inte undan <span class="muted">(${tot} mot ${dc})</span>. <span class="dmg">${dm} skada</span>.`,r,'fail')}
    adv.room.done=true;adv.phase=hero.hp<=0?'dead':'room';if(hero.hp<=0)die();
  }else if(t==='well'){adv.phase='room'}
  save();render();
}
function rollLoot(){
  const out=[];const g=roll('2d10')*hero.lvl+adv.chapter*5;out.push({k:'gold',n:`${g} guldmynt`,v:g});
  const r=Math.random();
  if(r<.45)out.push({k:'pot',n:'Läkedryck',sv:'Potion of Healing'});
  else if(r<.6)out.push({k:'gpot',n:'Stor läkedryck',sv:'Potion of Greater Healing'});
  else if(r<.75&&hero.wb<3)out.push({k:'wb',n:`Magiskt vapen +${hero.wb+1}`,sv:`Weapon, +${hero.wb+1}`});
  else if(r<.87&&hero.acb<2)out.push({k:'acb',n:hero.acb?'Skyddsmantel':'Skyddsring',sv:hero.acb?'Cloak of Protection':'Ring of Protection'});
  else out.push({k:'pot',n:'Läkedryck',sv:'Potion of Healing'});
  if(Math.random()<.3)out.push({k:'xp',n:'En gammal karta med ledtrådar',v:25*hero.lvl});
  return out;
}
function takeLoot(){
  for(const it of adv.room.loot){
    if(it.k==='gold')hero.gold+=it.v;else if(it.k==='pot')hero.potions++;else if(it.k==='gpot')hero.greater++;
    else if(it.k==='wb'){hero.wb++;hero.items.push(it.n)}else if(it.k==='acb'){hero.acb++;hero.items.push(it.n)}
    else if(it.k==='xp'){gainXp(it.v)}
  }
  log('',`${you()} packar ner: ${adv.room.loot.map(i=>i.n).join(', ')}.`,'¤','heal');
  adv.room.done=true;save();render();
}
function rest(){
  const before=hero.hp;const heal=Math.max(1,Math.ceil(hero.hpMax/2));hero.hp=Math.min(hero.hpMax,hero.hp+heal);
  resetRest(hero,false);let extra='';if(CL[hero.cls].sa&&hero.cls!=='warlock'&&hero.slots<slotsFor(hero)){hero.slots++;extra=' och får tillbaka en formelplats'}
  log('',`${you()} vilar vid brasan. <span class="heal">+${hero.hp-before} liv</span>${extra}. Förmågor laddade.`,'z','heal');
  adv.room.done=true;save();render();
}
function drinkWell(){
  const r=Math.random();
  if(r<.5){const h=roll('2d8');const b=hero.hp;hero.hp=Math.min(hero.hpMax,hero.hp+h);log('',`Vattnet är klart och friskt. <span class="heal">+${hero.hp-b} liv</span>.`,'~','heal')}
  else if(r<.8){log('',`Visdomens källa! Bilder av gamla strider fladdrar förbi.`,'~','magic');gainXp(40*hero.lvl)}
  else{const dm=d(4);hurtHero(dm);log('',`Bittert! Vattnet var förgiftat. <span class="dmg">${dm} skada</span>.`,'~','fail');if(hero.hp<=0){die();}}
  adv.room.done=true;save();render();
}
function nextRoom(){
  if(adv.phase==='won'){adv.chapter++;adv.depth=1;hero.hp=hero.hpMax;resetRest(hero,true);log('sep',`Kapitel ${adv.chapter} · Djupare ner`);log('note',`${you()} har vilat ut och hittar en trappa längre ner i berget.`,'·')}
  else adv.depth++;
  adv.phase='doors';adv.room=null;adv.foe=null;adv.doors=makeDoors();save();render();
}

/* ---------- Strid ---------- */
function resist(type){const r=RC[hero.race];if(hero.race==='dwarf'&&type==='poison')return true;if(hero.race==='tiefling'&&type==='fire')return true;if(hero.dragon&&type===hero.dragon)return true;if(adv.rage&&['bludgeoning','piercing','slashing'].includes(type))return true;return false}
function hurtHero(n){hero.hp=Math.max(0,hero.hp-n);if(hero.hp===0&&hero.race==='half-orc'&&hero.relent){hero.relent=0;hero.hp=1;log('note',`${you()} vägrar falla! Halvorkens seghet håller hen kvar med 1 liv.`,'!','heal')}}
function foeTypeMod(n,type){const m=adv.foe.m;if(m.im&&m.im.includes(type))return{v:0,note:` <span class="muted">(immun mot ${DMG[type]})</span>`};if(m.rs&&m.rs.includes(type))return{v:Math.floor(n/2),note:` <span class="muted">(tål ${DMG[type]}, halv skada)</span>`};if(m.vu&&m.vu.includes(type))return{v:n*2,note:` <span class="muted">(sårbar för ${DMG[type]}!)</span>`};return{v:n,note:''}}
function hitFoe(n){adv.foe.hp=Math.max(0,adv.foe.hp-n);adv.shake='foe'}
function heroD20(){let r=d(20);if(r===1&&hero.race==='halfling'){const r2=d(20);log('note',`Halvlingstur! Ettan slås om till ${r2}.`,'↻');r=r2}return r}

function doAttack(wi){
  const s=wStats(hero,wi),m=adv.foe.m;
  const swing=(label,hitB,dice,dm,type,canSneak)=>{
    if(adv.foe.hp<=0)return;
    const r=heroD20(),tot=r+hitB,crit=r===20,hit=crit||(r!==1&&tot>=m.ac);
    if(!hit){log('',`${you()} ${label}: <span class="muted">${r}${sgn(hitB)} = ${tot} mot rustning ${m.ac}</span>. Miss.`,r,r===1?'fail':'');return false}
    let raw=roll(dice,crit)+dm;let extra='';
    if(adv.rage&&!s.ranged){raw+=2;extra+=' +2 raseri'}
    if(canSneak&&hero.cls==='rogue'&&!adv.sneakUsed){const sn=roll(`${Math.ceil(hero.lvl/2)}d6`,crit);raw+=sn;adv.sneakUsed=true;extra+=` +${sn} lönnhugg`}
    const t=foeTypeMod(Math.max(1,raw),type);hitFoe(t.v);
    log('',`${you()} ${label}: <span class="muted">${r}${sgn(hitB)} = ${tot} mot ${m.ac}</span>. ${crit?'<b>Kritisk träff!</b>':'Träff!'} <span class="dmg">${t.v} skada</span> <span class="muted">(${DMG[type]}${extra})</span>${t.note}.`,r,crit?'crit':'hit');
    return true;
  };
  adv.sneakUsed=false;
  swing(`hugger med ${esc(s.name.toLowerCase())}`.replace('hugger',s.ranged?'skjuter':'anfaller'),s.hit,s.dice,s.dm,s.type,true);
  if(hero.cls==='monk'&&adv.foe.hp>0){const st=scores(hero),mm=Math.max(mod(st.str),mod(st.dex));swing('slår med knytnäven',prof(hero.lvl)+mm,hero.lvl>=5?'1d6':'1d4',mm,'bludgeoning',false)}
  if(hero.cls==='fighter'&&hero.lvl>=5&&adv.foe.hp>0)swing(`anfaller igen`,s.hit,s.dice,s.dm,s.type,false);
  endHeroTurn();
}
function doSpell(id){
  const s=SP[id],m=adv.foe.m,sm=spellMod(hero),pb=prof(hero.lvl),nm=esc(sName(id));
  if(s.l===1){if(hero.slots<=0)return;hero.slots--}
  if(s.h){const h=roll(s.h.replace('MOD',sgn(sm)).replace('+-','-'));const b=hero.hp;hero.hp=Math.min(hero.hpMax,hero.hp+Math.max(1,h));log('',`${you()} använder ${nm}. <span class="heal">+${hero.hp-b} liv</span>.`,'✚','heal');endHeroTurn();return}
  const dice=spellDice(hero,s);
  if(s.at){const r=heroD20(),tot=r+pb+sm,crit=r===20,hit=crit||(r!==1&&tot>=m.ac);
    if(!hit)log('',`${you()} kastar ${nm}: <span class="muted">${r}${sgn(pb+sm)} = ${tot} mot ${m.ac}</span>. Miss.`,r,'magic');
    else{const t=foeTypeMod(roll(dice,crit),s.t);hitFoe(t.v);log('',`${you()} kastar ${nm}: <span class="muted">${r}${sgn(pb+sm)} = ${tot} mot ${m.ac}</span>. ${crit?'<b>Kritisk träff!</b>':'Träff!'} <span class="dmg">${t.v} skada</span> <span class="muted">(${DMG[s.t]})</span>${t.note}.`,r,crit?'crit':'magic')}}
  else if(s.dc){const dc=8+pb+sm,r=d(20),tot=r+mod(m.st[AB.indexOf(s.dc)]),ok=tot>=dc;let n=roll(dice);if(ok)n=s.hf?Math.floor(n/2):0;const t=foeTypeMod(n,s.t);hitFoe(t.v);
    log('',`${you()} kastar ${nm}. ${them()} försöker stå emot (${AB_K[s.dc]}): <span class="muted">${tot} mot ${dc}</span>. ${ok?(s.hf?'Delvis!':'Klarar sig!'):'Misslyckas!'} ${t.v?`<span class="dmg">${t.v} skada</span>`:''}${t.note}`,r,'magic')}
  else{const t=foeTypeMod(roll(dice),s.t);hitFoe(t.v);log('',`${you()} kastar ${nm}. Den träffar alltid! <span class="dmg">${t.v} skada</span>${t.note}.`,'✦','magic')}
  endHeroTurn();
}
function doBreath(){
  hero.breath=0;const st=scores(hero),dc=8+mod(st.con)+prof(hero.lvl),m=adv.foe.m;const ab=['cold','poison'].includes(hero.dragon)?'con':'dex';
  const r=d(20),tot=r+mod(m.st[AB.indexOf(ab)]),ok=tot>=dc;let n=roll(`${hero.lvl>=6?3:2}d6`);if(ok)n=Math.floor(n/2);const t=foeTypeMod(n,hero.dragon);hitFoe(t.v);
  log('',`${you()} sprutar ${DMG[hero.dragon]} ur käften! ${them()} slår ${tot} mot ${dc}: ${ok?'halv skada':'full träff'}. <span class="dmg">${t.v} skada</span>${t.note}.`,'≋','magic');endHeroTurn();
}
function doPotion(greater){if(greater){if(!hero.greater)return;hero.greater--}else{if(!hero.potions)return;hero.potions--}
  const h=roll(greater?'4d4+4':'2d4+2'),b=hero.hp;hero.hp=Math.min(hero.hpMax,hero.hp+h);
  log('',`${you()} dricker en ${greater?'stor läkedryck':'läkedryck'}. <span class="heal">+${hero.hp-b} liv</span>.`,'✚','heal');
  if(adv.phase==='fight')endHeroTurn();else{save();render()}}
function doSecondWind(){hero.sw=0;const h=roll('1d10')+hero.lvl,b=hero.hp;hero.hp=Math.min(hero.hpMax,hero.hp+h);log('',`${you()} tar ett djupt andetag. Andra andningen: <span class="heal">+${hero.hp-b} liv</span>. Turen fortsätter.`,'✚','heal');save();render()}
function doRage(){hero.rage--;adv.rage=true;log('',`${you()} vrålar och går in i raseri!`,'!','crit');save();render()}
function doLay(){const need=hero.hpMax-hero.hp,use=Math.min(need,hero.loh);hero.loh-=use;hero.hp+=use;log('',`${you()} lägger händerna på såren. <span class="heal">+${use} liv</span>.`,'✚','heal');endHeroTurn()}
function doFlee(){
  if(adv.room&&adv.room.t==='boss')return;
  const r=d(20),tot=r+mod(scores(hero).dex),dc=10+mod(adv.foe.m.st[1]);
  if(tot>=dc){log('',`${you()} springer för livet <span class="muted">(${tot} mot ${dc})</span> och kommer undan!`,r,'hit');adv.foe=null;adv.phase='room';adv.room.done=true;adv.rage=false;adv.fled=true;save();render()}
  else{log('',`${you()} försöker fly men ${them()} spärrar vägen <span class="muted">(${tot} mot ${dc})</span>.`,r,'fail');endHeroTurn()}
}
function endHeroTurn(){
  if(adv.foe&&adv.foe.hp<=0){winFight();return}
  save();render();
  adv.busy=true;render();
  setTimeout(()=>{adv.busy=false;monsterTurn();save();render()},reduced?120:650);
}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function monsterTurn(){
  const f=adv.foe;if(!f||f.hp<=0||hero.hp<=0)return;const m=f.m;const myAc=ac(hero);
  const sv=m.sv;
  if(sv&&!f.charged&&sv.r){const r=d(6);if(r>=sv.r){f.charged=true;log('note',`${them()} laddar ${esc(sv.n)} igen.`,'d6')}}
  if(sv&&f.charged&&!f.first){
    f.charged=false;const st=scores(hero),abi=sv.ab;let saveB=mod(st[abi]||10);if(CL[hero.cls].sv.includes(abi))saveB+=prof(hero.lvl);
    const r=d(20),tot=r+saveB,ok=tot>=sv.dc;let n=0,parts=[];for(const [dc,t] of sv.d){let v=roll(dc);if(resist(t))v=Math.floor(v/2);n+=v;parts.push(DMG[t]||t)}
    if(ok)n=sv.h?Math.floor(n/2):0;hurtHero(n);adv.shake='hero';
    log('',`${them()} använder <b>${esc(sv.n)}</b>! ${you()} försöker undvika (${AB_K[abi]}): <span class="muted">${tot} mot ${sv.dc}</span>. ${ok?(sv.h?'Halv skada.':'Undvek helt!'):'Full träff!'} ${n?`<span class="dmg">${n} skada</span> <span class="muted">(${parts.join(', ')})</span>`:''}`,r,ok?'':'fail');
  }else{
    let plan=[];if(m.m){for(const [nm,c] of m.m){const a=m.a.find(x=>x.n===nm);if(!a)continue;const cnt=typeof c==='number'?c:roll(c);for(let k=0;k<cnt;k++)plan.push(a)}}
    if(!plan.length)plan=[m.a.slice().sort((x,y)=>y.d.reduce((s,z)=>s+avg(z[0]),0)-x.d.reduce((s,z)=>s+avg(z[0]),0))[0]];
    for(const a of plan){if(hero.hp<=0)break;
      const r=d(20),tot=r+a.b,crit=r===20,hit=crit||(r!==1&&tot>=myAc);
      if(!hit){log('',`${them()} anfaller med ${esc(a.n)}: <span class="muted">${r}${sgn(a.b)} = ${tot} mot ${myAc}</span>. Miss.`,r,'');continue}
      let n=0;const parts=[];let res=false;for(const [dc,t] of a.d){let v=roll(dc,crit);if(resist(t)){v=Math.floor(v/2);res=true}n+=v;parts.push(DMG[t]||t)}
      hurtHero(n);adv.shake='hero';
      log('',`${them()} anfaller med ${esc(a.n)}: <span class="muted">${r}${sgn(a.b)} = ${tot} mot ${myAc}</span>. ${crit?'<b>Kritisk träff!</b>':'Träff!'} <span class="dmg">${n} skada</span> <span class="muted">(${parts.join(', ')}${res?', du tål det, halv skada':''})</span>.`,r,crit?'fail':'fail');
    }
  }
  f.first=false;
  if(hero.hp<=0)die();
}
function winFight(){
  const m=adv.foe.m;adv.kills++;adv.rage=false;
  log('',`${them()} faller! ${you()} får <b>${Math.max(10,m.xp)} XP</b>.`,'✝','crit');
  gainXp(Math.max(10,m.xp));
  if(hero.hp<hero.hpMax){const b=hero.hp;hero.hp=Math.min(hero.hpMax,hero.hp+Math.max(1,d(CL[hero.cls].hd)+mod(scores(hero).con)));log('',`${you()} andas ut och binder om såren. <span class="heal">+${hero.hp-b} liv</span>.`,'✚','heal')}
  const boss=adv.room.t==='boss';
  if(boss){adv.phase='won';adv.room.loot=rollLoot();adv.room.loot.push({k:'gpot',n:'Stor läkedryck',sv:'Potion of Greater Healing'});takeLootSilent();}
  else{adv.phase='room';adv.room.done=true;if(Math.random()<.35){adv.room.loot=rollLoot().slice(0,1);takeLootSilent()}}
  adv.lastFoe=m.n;adv.foe=null;save();render();
}
function takeLootSilent(){const names=[];for(const it of adv.room.loot){if(it.k==='gold')hero.gold+=it.v;else if(it.k==='pot')hero.potions++;else if(it.k==='gpot')hero.greater++;else if(it.k==='wb'){hero.wb++;hero.items.push(it.n)}else if(it.k==='acb'){hero.acb++;hero.items.push(it.n)}else if(it.k==='xp')gainXp(it.v);names.push(it.n)}log('',`Byte: ${names.join(', ')}.`,'¤','heal')}
function gainXp(n){
  hero.xp+=n;adv.xpGain+=n;
  while(hero.lvl<10&&hero.xp>=XPT[hero.lvl]){
    hero.lvl++;const st=scores(hero);const inc=Math.max(1,Math.floor(CL[hero.cls].hd/2)+1+mod(st.con));hero.hpMax+=inc;hero.hp+=inc;
    hero.loh=5*hero.lvl;const ns=slotsFor(hero);hero.slots=ns;
    let more=[`+${inc} liv`];if(ns)more.push(`${ns} formelplatser`);if(hero.lvl===5)more.push('träffsäkerheten ökar');if(hero.cls==='fighter'&&hero.lvl===5)more.push('två anfall per tur');if(hero.cls==='rogue'&&hero.lvl%2===1)more.push('starkare lönnhugg');
    log('',`<span class="levelup">Ny nivå! ${esc(hero.name.split(' ')[0])} är nu nivå ${hero.lvl}</span>: ${more.join(', ')}.`,'★','crit');
  }
}
function die(){adv.phase='dead';log('sep','Hjälten har fallit')}
function retry(){hero=JSON.parse(JSON.stringify(hero.start));startAdventure();save();render()}
function newOne(){adv=null;hero=newHero();setView('gen')}

/* ---------- Vy: äventyr ---------- */
function meter(label,v,max,cls){const p=Math.max(0,Math.min(100,v/max*100));return `<div class="meter"><div class="top"><span>${label}</span><span><strong>${v}</strong> / ${max}</span></div><div class="bar ${cls||''}"><i class="${cls?'':p<30?'low':''}" style="width:${p}%"></i></div></div>`}
function renderAdv(){
  const h=hero;const st=scores(h);
  const nextXp=h.lvl<10?XPT[h.lvl]:h.xp,prevXp=XPT[h.lvl-1];
  const status=`<aside class="sheet status ${adv.shake==='hero'?'shake':''}" aria-label="Hjälten">
    <div class="who"><span class="eyebrow">${RACE_SV[h.race]} ${CLS_SV[h.cls].toLowerCase()}</span><h2>${esc(h.name)}</h2></div>
    ${meter('Liv',h.hp,h.hpMax)}
    ${meter(`Nivå ${h.lvl} · XP`,h.xp-prevXp,nextXp-prevXp||1,'xp')}
    <div class="minis"><div><b>${ac(h)}</b><span>Rustning</span></div><div><b>${h.lvl}</b><span>Nivå</span></div><div><b>${h.gold}</b><span>Guld</span></div></div>
    ${CL[h.cls].sa?`<div class="block"><span class="eyebrow">Formelplatser</span><div class="pips">${Array.from({length:slotsFor(h)},(_,i)=>`<i class="${i<h.slots?'on':''}"></i>`).join('')}</div></div>`:''}
    <div class="bag"><span class="eyebrow">Packning</span>
      <div class="line"><span>Läkedryck</span><code>${h.potions} st</code></div>
      ${h.greater?`<div class="line"><span>Stor läkedryck</span><code>${h.greater} st</code></div>`:''}
      ${h.items.map(i=>`<div class="line"><span>${esc(i)}</span></div>`).join('')}
      ${h.cls==='paladin'?`<div class="line"><span>Helande händer</span><code>${h.loh} liv kvar</code></div>`:''}
    </div>
    <div class="muted" style="font-size:13px">Besegrade: ${adv.kills} · Kapitel ${adv.chapter}</div>
  </aside>`;
  let steps='';for(let i=1;i<=DEPTH;i++){steps+=(i>1?'<span class="rule"></span>':'')+(i===DEPTH?`<span class="step boss ${adv.depth===i?'here':''}" title="Bossen">Boss</span>`:`<span class="step ${i<adv.depth?'done':''} ${i===adv.depth?'here':''}">${i}</span>`)}
  let stage='';
  const P=adv.phase;
  if(P==='doors'){
    if(adv.depth===DEPTH){stage=`<h2>Den sista porten</h2><p>En väldig dörr av svart järn. Bakom den väntar grottans härskare. Det finns ingen väg runt.</p><div class="actions"><button class="btn primary" data-act="enter" data-t="boss">Öppna porten</button>${h.potions&&h.hp<h.hpMax?`<button class="btn" data-act="pot">Drick läkedryck först</button>`:''}</div>`}
    else stage=`<h2>${adv.depth===1&&adv.chapter===1?'Grottans mynning':'Två vägar'}</h2><p>Gången delar sig. Lyssna noga och välj väg.</p><div class="doors">${adv.doors.map((x,i)=>`<button class="door" type="button" data-act="enter" data-t="${x.t}"><span class="knob">${i?'ᚱ':'ᚲ'}</span><span class="lbl">${i?'Höger':'Vänster'} väg</span><span class="hint">${x.hint}</span></button>`).join('')}</div>`;
  }else if(P==='fight'){
    const f=adv.foe,m=f.m,p=f.hp/m.hp*100;
    const acts=[];
    h.weapons.forEach(wi=>{const s=wStats(h,wi);acts.push(`<button class="btn" data-act="atk" data-w="${wi}">${s.ranged?'Skjut':'Anfall'}: ${esc(s.name)}<small>${sgn(s.hit)} · ${s.dice}${s.dm?sgn(s.dm):''}</small></button>`)});
    h.spells.forEach(id=>{const s=SP[id];const dis=s.l===1&&h.slots<=0;acts.push(`<button class="btn magic" data-act="spell" data-s="${id}" ${dis?'disabled':''}>${esc(sName(id))}<small>${s.h?'läker':spellDice(h,s)+' '+DMG[s.t]}${s.l?' · plats':''}</small></button>`)});
    if(h.cls==='fighter')acts.push(`<button class="btn" data-act="sw" ${h.sw?'':'disabled'}>Andra andningen<small>gratis · ${h.sw?'redo':'använd'}</small></button>`);
    if(h.cls==='barbarian')acts.push(`<button class="btn" data-act="rage" ${h.rage&&!adv.rage?'':'disabled'}>${adv.rage?'Rasar!':'Raseri'}<small>gratis · ${h.rage} kvar</small></button>`);
    if(h.cls==='paladin')acts.push(`<button class="btn" data-act="lay" ${h.loh&&h.hp<h.hpMax?'':'disabled'}>Helande händer<small>${h.loh} kvar</small></button>`);
    if(h.dragon)acts.push(`<button class="btn magic" data-act="breath" ${h.breath?'':'disabled'}>Andningsvapen<small>${h.lvl>=6?3:2}T6 ${DMG[h.dragon]}</small></button>`);
    acts.push(`<button class="btn" data-act="pot" ${h.potions&&h.hp<h.hpMax?'':'disabled'}>Läkedryck<small>${h.potions} st · 2T4+2</small></button>`);
    if(h.greater)acts.push(`<button class="btn" data-act="gpot" ${h.hp<h.hpMax?'':'disabled'}>Stor läkedryck<small>${h.greater} st · 4T4+4</small></button>`);
    acts.push(adv.room.t==='boss'?`<button class="btn" disabled>Fly<small>ingen väg ut</small></button>`:`<button class="btn" data-act="flee">Fly<small>SMI mot ${10+mod(m.st[1])}</small></button>`);
    stage=`<div class="foe ${adv.shake==='foe'?'shake':''}"><div class="rune" aria-hidden="true">${SIGIL[m.t]||'ᛦ'}</div><div style="min-width:0"><h3>${esc(m.n)}</h3><div class="meta">${SIZE[m.s]} ${TYPE[m.t]||m.t} · farlighet ${crTxt(m.cr)}${m.im?` · immun: ${m.im.map(t=>DMG[t]).join(', ')}`:''}${m.rs?` · tål: ${m.rs.map(t=>DMG[t]).join(', ')}`:''}${m.vu?` · sårbar: ${m.vu.map(t=>DMG[t]).join(', ')}`:''}</div></div><div class="nums">Rustning <b>${m.ac}</b><br>Liv <b>${f.hp}</b> / ${m.hp}</div><div class="bar"><i class="${p<30?'low':''}" style="width:${p}%"></i></div></div>
      <div class="actions" aria-busy="${!!adv.busy}">${acts.join('').replace(/<button /g,adv.busy?'<button disabled ':'<button ')}</div>`;
  }else if(P==='room'){
    const t=adv.room.t;
    if(t==='treasure'&&!adv.room.done)stage=`<h2>En gammal kista</h2><p>Locket gnisslar när du lyfter det.</p><div class="loot">${adv.room.loot.map(i=>`<div><b>${esc(i.n)}</b><span class="muted">${i.sv||''}</span></div>`).join('')}</div><div class="actions"><button class="btn primary" data-act="take">Ta allt</button></div>`;
    else if(t==='camp'&&!adv.room.done)stage=`<h2>Lägerplatsen</h2><p>En torr nisch, en gammal sovfäll och glöd som fortfarande lever. En kort vila läker halva ditt liv och laddar dina förmågor.</p><div class="actions"><button class="btn primary" data-act="rest">Vila en stund</button><button class="btn" data-act="next">Gå vidare utan vila</button></div>`;
    else if(t==='well'&&!adv.room.done)stage=`<h2>Den blå brunnen</h2><p>Vattnet lyser svagt. Det kan läka, ge visdom, eller vara bittert.</p><div class="actions"><button class="btn primary" data-act="well">Drick</button><button class="btn" data-act="next">Låt bli</button></div>`;
    else{const title=adv.fled?'Undan!':t==='fight'?'Segern är din':t==='trap'?'Fällan':t==='treasure'?'Fickorna fulla':t==='camp'?'Utvilad':'Vidare';adv.fled=false;
      stage=`<h2>${title}</h2><p>${t==='fight'&&adv.lastFoe?`${esc(adv.lastFoe)} ligger slagen på stengolvet.`:'Gången fortsätter neråt i mörkret.'}</p><div class="actions"><button class="btn primary" data-act="next">Gå djupare</button>${h.potions&&h.hp<h.hpMax/2?`<button class="btn" data-act="pot">Drick läkedryck</button>`:''}</div>`}
  }else if(P==='won'){
    stage=`<div class="banner"><span class="big">Kapitel ${adv.chapter} klart!</span>${esc(h.name)} besegrade ${esc(adv.lastFoe)} och blev grottans hjälte. Totalt ${adv.kills} besegrade fiender.</div><p>Längre ner i berget finns fler gångar, och farligare monster. Du vilar ut helt innan du fortsätter.</p><div class="actions"><button class="btn primary" data-act="next">Gå ner till kapitel ${adv.chapter+1}</button><button class="btn" data-act="newone">Skapa en ny hjälte</button></div>`;
  }else if(P==='dead'){
    stage=`<div class="banner dead"><span class="big">${esc(h.name)} har fallit</span>på djup ${adv.depth} i kapitel ${adv.chapter}, nivå ${h.lvl}, efter ${adv.kills} besegrade fiender.</div><div class="actions"><button class="btn primary" data-act="retry">Samma hjälte, nytt försök</button><button class="btn" data-act="newone">Skapa en ny hjälte</button></div>`;
  }
  const logHtml=adv.log.map(e=>e.c==='sep'?`<li class="sep">${e.h}</li>`:`<li class="${e.c}"><span class="chip ${e.cc||''}">${e.ch??'·'}</span><div>${e.h}</div></li>`).join('');
  $view.innerHTML=`<div class="adv">${status}<section class="scene">
    <div class="depth" aria-label="Djup i grottan">${steps}</div>
    <div class="sheet stage">${stage}</div>
    <div><div class="log-head"><h3>Krönikan</h3><button class="btn" data-act="abandon" type="button" style="font-size:13px;padding:5px 10px">Avsluta äventyret</button></div><ol class="log" id="log">${logHtml}</ol></div>
  </section></div>`;
  const lg=document.getElementById('log');lg.scrollTop=lg.scrollHeight;adv.shake=null;
}
$view.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||!adv||b.disabled)return;
  const a=b.dataset.act;
  if(adv.busy&&adv.phase==='fight'&&a!=='abandon')return;
  ({enter:()=>enterRoom(b.dataset.t),atk:()=>doAttack(b.dataset.w),spell:()=>doSpell(b.dataset.s),sw:doSecondWind,rage:doRage,lay:doLay,breath:doBreath,
    pot:()=>doPotion(false),gpot:()=>doPotion(true),flee:doFlee,take:takeLoot,rest,well:drinkWell,next:nextRoom,retry,newone:newOne,
    abandon:()=>{if(b.dataset.confirm){adv=null;hero=hero.start?JSON.parse(JSON.stringify(hero.start)):hero;setView('gen')}else{b.dataset.confirm='1';b.textContent='Säker? Tryck igen'}}
  })[a]?.();
});

function render(){if(view==='adv'&&adv)renderAdv();else renderGen()}
document.getElementById('tabGen').setAttribute('aria-selected',String(view==='gen'));document.getElementById('tabAdv').setAttribute('aria-selected',String(view==='adv'));
render();
window.__t={newHero,startAdventure:()=>{startAdventure()},get hero(){return hero},get adv(){return adv},enterRoom,doAttack,doSpell,nextRoom,takeLoot,rest,drinkWell,doPotion,doFlee,monsterTurn};
})();
</script>

</body></html>
