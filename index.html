<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="theme-color" content="#0e0f13"><link rel="manifest" href="manifest.webmanifest?v=4"><link rel="icon" href="icons/favicon.svg" type="image/svg+xml"><link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Nat20"></head><body>
<title>Nat20</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: a modern game HUD. Step 1 is a character builder with stat tiles; step 2 is the run, with a hero HUD, a depth track to the boss and a live combat feed. Ember for action, gold for reward, a cool blue for magic. */
:root{
  --bg:#0e0f13; --bg2:#15161c; --surface:#1b1d24; --raised:#232631; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --ink:#f1f0ee; --muted:#9a9ba5; --ember:#ff6b3d; --ember2:#ff9a3d; --ember-ink:#1a0a04;
  --gold:#f3c45a; --good:#5fd38a; --bad:#ff5a5f; --magic:#7aa7ff; --track:rgba(255,255,255,.07);
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 20px 40px -24px rgba(0,0,0,.7);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px; --r-sm:12px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef0f3; --bg2:#e6e9ee; --surface:#ffffff; --raised:#f5f6f8; --line:rgba(15,20,35,.09); --line2:rgba(15,20,35,.16);
  --ink:#16181f; --muted:#5f6370; --ember:#e8501f; --ember2:#f27a1f; --ember-ink:#ffffff;
  --gold:#a8750c; --good:#1d9a52; --bad:#d6323a; --magic:#2f62d6; --track:rgba(15,20,35,.08);
  --shadow:0 1px 2px rgba(15,20,35,.06),0 14px 32px -20px rgba(15,20,35,.28); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef0f3; --bg2:#e6e9ee; --surface:#ffffff; --raised:#f5f6f8; --line:rgba(15,20,35,.09); --line2:rgba(15,20,35,.16);
  --ink:#16181f; --muted:#5f6370; --ember:#e8501f; --ember2:#f27a1f; --ember-ink:#ffffff;
  --gold:#a8750c; --good:#1d9a52; --bad:#d6323a; --magic:#2f62d6; --track:rgba(15,20,35,.08);
  --shadow:0 1px 2px rgba(15,20,35,.06),0 14px 32px -20px rgba(15,20,35,.28); color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px;
  background-image:radial-gradient(60% 40% at 15% 0%,color-mix(in srgb,var(--ember) 12%,transparent),transparent 70%),radial-gradient(50% 35% at 100% 10%,color-mix(in srgb,var(--magic) 8%,transparent),transparent 70%);background-attachment:fixed}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:20px}
button,input,select{font:inherit;color:inherit}
button,select,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;margin:0;line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.more summary{display:none}
.status .first{display:none}
.more-in{display:grid;gap:14px}
.recent{display:none;list-style:none;margin:12px 0 0;padding:12px 0 0;gap:6px;border-top:1px solid var(--line)}
.recent li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:baseline;font-size:14.5px}

header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
header h1{font-family:"Cinzel Decorative","Cinzel",Georgia,serif;font-weight:700;letter-spacing:.01em;font-size:clamp(44px,7vw,76px);line-height:1.1;margin-top:.12em;padding-left:.1em}
header h1 .acc{background:linear-gradient(100deg,var(--ember),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow)}
.tabs button{border:0;background:transparent;padding:9px 16px;cursor:pointer;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center;border-radius:999px;min-height:42px;transition:background .2s,color .2s}
.tabs button .n{font-family:var(--f-mono);font-size:11.5px;background:var(--raised);border-radius:999px;width:22px;height:22px;display:grid;place-items:center}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs button[aria-selected="true"] .n{background:var(--ember);color:var(--ember-ink)}

.btn{min-height:44px;border:1px solid var(--line);background:var(--raised);border-radius:var(--r-sm);padding:9px 14px;cursor:pointer;font-weight:700;font-size:15px;transition:transform .12s,border-color .15s,background .15s}
@media (hover:hover){.btn:hover:not(:disabled){border-color:var(--line2);background:color-mix(in srgb,var(--raised) 85%,var(--ink) 6%)}}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--ember),var(--ember2));border-color:transparent;color:var(--ember-ink);padding:12px 22px;font-size:16.5px;box-shadow:0 10px 24px -12px color-mix(in srgb,var(--ember) 80%,transparent)}
@media (hover:hover){.btn.primary:hover:not(:disabled){filter:brightness(1.06);background:linear-gradient(135deg,var(--ember),var(--ember2))}}
.btn.magic{border-color:color-mix(in srgb,var(--magic) 45%,transparent);background:color-mix(in srgb,var(--magic) 10%,var(--raised))}
.btn small{display:block;font-weight:500;font-size:12px;color:var(--muted);font-family:var(--f-mono);letter-spacing:-.01em}
.btn.primary small{color:inherit;opacity:.8}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;position:relative;box-shadow:var(--shadow)}

/* Generator */
.gen{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.gen-main{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.gen-side,.scene,.status,.block{grid-template-columns:minmax(0,1fr)}
.namebar{display:grid;gap:8px}
.namebar .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.namebar input{flex:1;width:100%;min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;font-size:clamp(26px,4vw,36px);line-height:1.15;padding:8px 14px}
.namebar input:focus{border-color:var(--ember);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--ember) 18%,transparent)}
.subline{font-size:16px;color:var(--muted);font-weight:500}
.choose{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choose label{display:grid;gap:6px;font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.choose select{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--f-body);font-size:16px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink);min-height:46px}
.abil{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.ab{border:1px solid var(--line);border-radius:14px;background:var(--raised);padding:10px 4px 8px;text-align:center;display:grid;gap:2px;position:relative}
.ab.key{border-color:color-mix(in srgb,var(--gold) 55%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 12%,var(--raised)),var(--raised))}
.ab .lbl{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.ab .val{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.ab .mod{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--gold)}
.ab .dice{display:flex;gap:2px;justify-content:center;margin-top:5px}
.ab .dice span{font-family:var(--f-mono);font-size:10px;width:15px;height:15px;background:var(--track);border-radius:4px;display:grid;place-items:center}
.ab .dice span.drop{opacity:.35;text-decoration:line-through}
.ab .race{font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--good);position:absolute;top:5px;right:7px}
.vitals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.vitals div{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;display:grid}
.vitals b{font-family:var(--f-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.vitals span{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gen-side{display:grid;gap:18px}
.block{display:grid;gap:6px}
.block h3{font-size:20px}
.line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:7px 0;font-size:15px}
.line:last-child{border-bottom:0}
.line code{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.line .sv{display:block;font-size:12.5px;color:var(--muted)}
.gen-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Adventure */
.adv{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.status{display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.status .who h2{font-size:28px;overflow-wrap:anywhere}
.meter{display:grid;gap:6px}
.meter .top{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter .top strong{color:var(--ink)}
.bar{height:10px;background:var(--track);border-radius:999px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--good),color-mix(in srgb,var(--good) 60%,var(--gold)));box-shadow:0 0 12px color-mix(in srgb,var(--good) 45%,transparent);transition:width .45s cubic-bezier(.3,.7,.3,1)}
.bar i.low{background:linear-gradient(90deg,var(--bad),var(--ember2));box-shadow:0 0 12px color-mix(in srgb,var(--bad) 50%,transparent)}
.bar.xp i{background:linear-gradient(90deg,var(--gold),var(--ember2));box-shadow:none}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.minis div{border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;background:var(--raised)}
.minis b{display:block;font-family:var(--f-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.minis span{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pips i{width:14px;height:14px;border-radius:5px;border:1.5px solid var(--magic)}
.pips i.on{background:var(--magic);box-shadow:0 0 10px color-mix(in srgb,var(--magic) 55%,transparent)}
.bag{display:grid;gap:2px;font-size:14px}

.scene{display:grid;gap:16px}
.depth{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.depth .step{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.depth .step.done{background:color-mix(in srgb,var(--gold) 18%,var(--surface));color:var(--ink);border-color:transparent}
.depth .step.here{background:var(--ink);color:var(--bg);border-color:transparent;box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 14%,transparent)}
.depth .step.boss{width:auto;padding:0 10px;font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.depth .step.boss.here{background:var(--bad);color:#fff}
.depth .rule{flex:0 0 10px;height:2px;border-radius:2px;background:var(--line2)}
.stage h2{font-size:clamp(28px,3.8vw,40px);margin-bottom:8px}
.stage p{margin:0 0 12px;max-width:62ch;color:color-mix(in srgb,var(--ink) 88%,var(--muted))}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:6px}
.door{border:1px solid var(--line);background:var(--raised);border-radius:16px;padding:18px;text-align:left;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;row-gap:2px;align-items:center;transition:border-color .2s,transform .2s,box-shadow .2s}
@media (hover:hover){.door:hover{border-color:color-mix(in srgb,var(--ember) 55%,transparent);transform:translateY(-2px);box-shadow:0 14px 28px -18px color-mix(in srgb,var(--ember) 70%,transparent)}}
.door .knob{grid-row:1/span 3;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--surface));line-height:1}
.door .hint{font-size:16px;font-weight:600}
.door .known{font-size:13.5px;font-weight:700;color:var(--gold)}
.door .lbl{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.foe{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--bad) 14%,var(--raised)),var(--raised) 70%);margin-bottom:14px}
.foe .rune{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;color:#fff;background:linear-gradient(135deg,var(--bad),var(--ember));box-shadow:0 8px 20px -10px var(--bad)}
.foe h3{font-size:26px;overflow-wrap:anywhere}
.foe .meta{font-size:13.5px;color:var(--muted)}
.foe .nums{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--muted);white-space:nowrap}
.foe .nums b{color:var(--ink);font-size:16px}
.foe .bar{grid-column:1/-1}
@keyframes hit{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}65%{transform:translateX(4px)}}
.shake{animation:hit .35s ease}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.loot{display:grid;gap:8px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);background:color-mix(in srgb,var(--gold) 8%,var(--raised));border-radius:14px;padding:14px 16px;margin:6px 0 14px}
.loot div{display:flex;justify-content:space-between;gap:10px}
.loot b{color:var(--gold)}
.banner{border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:16px;padding:20px;text-align:center;background:radial-gradient(80% 120% at 50% 0%,color-mix(in srgb,var(--gold) 18%,var(--raised)),var(--raised));margin-bottom:14px}
.banner .big{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;font-size:34px;line-height:1.05;display:block;margin-bottom:4px}
.banner.dead{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:radial-gradient(80% 120% at 50% 0%,color-mix(in srgb,var(--bad) 16%,var(--raised)),var(--raised))}
.levelup{color:var(--gold);font-weight:800}

.log{list-style:none;margin:0;padding:8px 16px 14px;max-height:340px;overflow-y:auto;display:grid;gap:0;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.log li{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.log li:last-child{border-bottom:0}
.log li.sep{grid-template-columns:1fr;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);padding-top:14px;border:0}
.chip{font-family:var(--f-mono);font-size:12px;font-weight:600;text-align:center;background:var(--track);border-radius:999px;padding:2px 0;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.hit{color:var(--ink);background:color-mix(in srgb,var(--ink) 12%,transparent)}
.chip.crit{color:#1a1204;background:var(--gold)}
.chip.fail{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.chip.heal{color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}
.chip.magic{color:var(--magic);background:color-mix(in srgb,var(--magic) 15%,transparent)}
.dmg{color:var(--bad);font-weight:800}
.heal{color:var(--good);font-weight:800}
.you{color:var(--gold)}
.them{color:var(--ink);text-decoration:underline;text-decoration-color:var(--bad);text-decoration-thickness:2px;text-underline-offset:3px}
.log-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.log-head h3{font-size:20px}

footer{text-align:center;font-size:13px;color:var(--muted)}
footer a{color:inherit}
/* Dice tray */
.tray{position:fixed;inset:0;z-index:50;display:grid;align-items:end;justify-items:center}
.tray-back{position:absolute;inset:0;background:rgba(5,6,10,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.tray-card{position:relative;width:min(540px,100%);background:var(--surface);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -24px 60px -24px rgba(0,0,0,.65);display:grid;gap:14px;animation:trayup .22s ease-out;max-height:92vh;overflow-y:auto}
@media (min-width:700px){.tray{align-items:center}.tray-card{border-radius:24px;border-bottom:1px solid var(--line2);padding-bottom:18px}}
@keyframes trayup{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.tray h3{font-size:26px}
.tray-sub{color:var(--muted);font-size:14.5px;margin-top:4px}
.tray-sub b{color:var(--ink)}
.tray-dice{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:center;align-items:center;min-height:156px;padding:14px;border-radius:18px;background:var(--raised);border:1px dashed var(--line2)}
.tray-dice:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.tray-dice.done{cursor:default;border-style:solid}
.tray,.dice-opt{--die-a:#ffa04a;--die-b:#ff6b3d;--die-in:#ffb066;--die-ink:#1a0a04;--die-line:#1a0a04;--die-glow:#ff6b3d}
[data-dice="obsidian"]{--die-a:#454a58;--die-b:#101116;--die-in:#2b2e38;--die-ink:#f3c45a;--die-line:#f3c45a;--die-glow:#000000}
[data-dice="frost"]{--die-a:#f4fcff;--die-b:#8ccbf2;--die-in:#dcf2ff;--die-ink:#0f3554;--die-line:#2a6d9c;--die-glow:#7fc4f0}
[data-dice="bone"]{--die-a:#fdf6e4;--die-b:#cdb98e;--die-in:#f1e4c3;--die-ink:#3b2a17;--die-line:#6b5434;--die-glow:#a88f5c}
[data-dice="venom"]{--die-a:#c6f77a;--die-b:#36a224;--die-in:#a6e861;--die-ink:#0d2205;--die-line:#0d2a05;--die-glow:#4fc23a}

/* ---------- Dice ---------- */
const d=n=>1+Math.floor(Math.random()*n);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const mod=s=>Math.floor((s-10)/2);
const sgn=n=>(n>=0?'+':'')+n;
function parse(x){const m=String(x).match(/^(\d+)(?:d(\d+))?([+-]\d+)?$/);if(!m)return{n:0,s:0,k:0};return m[2]?{n:+m[1],s:+m[2],k:+(m[3]||0)}:{n:0,s:0,k:+m[1]+(+(m[3]||0))}}
function roll(x,crit){const p=parse(x);let t=p.k;const n=crit?p.n*2:p.n;for(let i=0;i<n;i++)t+=d(p.s);return Math.max(0,t)}
const avg=x=>{const p=parse(x);return p.n*(p.s+1)/2+p.k};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const crTxt=c=>c===0.125?'1/8':c===0.25?'1/4':c===0.5?'1/2':String(c);

/* ---------- Hero ---------- */
const XPT=[0,200,600,1500,3200,6000,10000,15000,22000,30000];
const prof=l=>2+Math.floor((l-1)/4);
function rollAbilities(){return Array.from({length:6},()=>{const r=[d(6),d(6),d(6),d(6)];const lo=r.indexOf(Math.min(...r));return{r,lo,t:r.reduce((a,b)=>a+b,0)-r[lo]}})}
function assign(rolls,cls){const sorted=rolls.slice().sort((a,b)=>b.t-a.t);const out={};PRI[cls].forEach((ab,i)=>out[ab]=sorted[i]);return out}
function slotsFor(h){if(!CL[h.cls].sa)return 0;if(h.cls==='warlock')return h.lvl<2?1:2;return [0,2,3,4,4,4,4,4,4,4][Math.min(h.lvl,9)]}
function scores(h){const r=RC[h.race];return Object.fromEntries(AB.map(a=>[a,h.base[a].t+(r.b[a]||0)]))}
function newHero(keep){
  const cls=keep&&keep.cls||pick(Object.keys(CLS_SV)), race=keep&&keep.race||pick(Object.keys(RACE_SV));
  const rolls=keep&&keep.rolls||rollAbilities();
  const h={v:1,name:keep&&keep.name||`${pick(NAMES)} ${pick(EPI)}`,cls,race,rolls,lvl:1,xp:0};
  h.base=assign(rolls,cls);
  const kit=KIT[cls];h.weapons=kit.w.filter(w=>W[w]);if(!h.weapons.length)h.weapons=['dagger'];
  h.armor=kit.ar;h.shield=!!kit.sh;
  h.dragon=race==='dragonborn'?pick(['fire','cold','lightning','acid','poison']):null;
  h.spells=[];
  if(CL[cls].sa){
    const pool=H.spells.filter(s=>s.c.includes(cls)&&!BAD_SPELL.includes(s.i));
    const can=pool.filter(s=>s.l===0).sort(()=>Math.random()-.5).slice(0,2);
    let l1=pool.filter(s=>s.l===1);const heals=l1.filter(s=>s.h),hurts=l1.filter(s=>!s.h);
    const chosen=[];if(heals.length&&['cleric','druid','bard'].includes(cls))chosen.push(pick(heals));
    hurts.sort(()=>Math.random()-.5).forEach(s=>{if(chosen.length<2)chosen.push(s)});
    if(chosen.length<2&&heals.length&&!chosen.includes(heals[0]))chosen.push(heals[0]);
    h.spells=[...can,...chosen].map(s=>s.i);
  }
  const st=scores(h);
  h.hpMax=Math.max(4,CL[cls].hd+Math.floor(CL[cls].hd/2)+mod(st.con));h.hp=h.hpMax;
  h.slots=slotsFor(h);h.potions=2;h.greater=0;h.gold=d(10)+5;h.wb=0;h.acb=0;h.items=[];
  resetRest(h,true);
  return h;
}
function resetRest(h,long){h.curse=0;h.sw=1;h.rage=2;h.breath=1;if(long){h.relent=1;h.loh=5*h.lvl;h.slots=slotsFor(h)}if(h.cls==='warlock')h.slots=slotsFor(h)}
function ac(h){const st=scores(h),dx=mod(st.dex);let v;
  if(h.armor){const a=AR[h.armor];v=a.b+(a.dx?(a.mx!=null?Math.min(dx,a.mx):dx):0)}
  else if(h.cls==='barbarian')v=10+dx+mod(st.con);else if(h.cls==='monk')v=10+dx+mod(st.wis);else if(h.cls==='wizard'||h.cls==='sorcerer')v=13+dx;else v=10+dx;
  return v+(h.shield?2:0)+h.acb-(h.curse||0)}
function wStats(h,wi){const w=W[wi],st=scores(h);let m;
  if(w.r)m=mod(st.dex);else if(w.f||h.cls==='monk')m=Math.max(mod(st.str),mod(st.dex));else m=mod(st.str);
  return{w,name:W_SV[wi]||w.n,hit:prof(h.lvl)+m+h.wb+(h.bless||0)+(h.cls==='ranger'&&w.r?2:0),dice:w.d,dm:m+h.wb,type:w.t,ranged:!!w.r}}
function spellMod(h){return mod(scores(h)[CL[h.cls].sa])}
function spellDice(h,s){if(typeof s.d==='string')return s.d;const keys=Object.keys(s.d).map(Number).sort((a,b)=>a-b);let k=keys[0];for(const x of keys)if(h.lvl>=x)k=x;return s.d[k]}

function renderGen(){
  const h=hero,st=scores(h),c=CL[h.cls],r=RC[h.race],pri=PRI[h.cls];
  const inAdv=adv&&adv.phase!=='dead';
  const abil=AB.map(a=>{const b=h.base[a];const rb=r.b[a]||0;return `<div class="ab ${pri.indexOf(a)<2?'key':''}" title="${AB_SV[a]}">
    ${rb?`<span class="race">+${rb}</span>`:''}<span class="lbl">${AB_K[a]}</span><span class="val">${st[a]}</span><span class="mod">${sgn(mod(st[a]))}</span>

  const weapons=h.weapons.map(wi=>{const s=wStats(h,wi);return `<div class="line"><span>${esc(s.name)}<span class="sv">${s.ranged?'Ranged':'Melee'}${h.wb?` · magic +${h.wb}`:''}</span></span><code>${sgn(s.hit)} to hit<br>${s.dice}${s.dm?sgn(s.dm):''} ${DMG[s.type]}</code></div>`}).join('');
  const armor=`<div class="line"><span>${h.armor?A_SV[h.armor]:(h.cls==='wizard'||h.cls==='sorcerer')?'Mage Armor':'No armor'}${h.shield?' + shield':''}</span><code>Armor class ${ac(h)}</code></div>`;
  const spells=h.spells.length?`<div class="block"><h3>Spells</h3>${h.spells.map(i=>{const s=SP[i];return `<div class="line"><span>${esc(sName(i))}<span class="sv">${s.l?'Level 1':'Cantrip, unlimited'}</span></span><code>${s.h?`heals ${s.h.replace('MOD',sgn(spellMod(h)))}`:`${spellDice(h,s)} ${DMG[s.t]}`}<br>${s.at?'spell attack':s.dc?`${AB_K[s.dc]} save`:'always hits'}</code></div>`}).join('')}<div class="muted" style="font-size:14px">${h.slots} level 1 spell slots. Spellcasting ${AB_K[c.sa]} ${sgn(spellMod(h))}.</div></div>`:'';
  const feats=[FEAT_SV[h.cls],RACE_FT[h.race]+(h.dragon?` Element: ${DMG[h.dragon]}.`:'')].filter(Boolean).map(t=>`<div class="line"><span>${t}</span></div>`).join('');
  $view.innerHTML=`
  <div class="gen">
    <section class="sheet gen-main" aria-label="Character sheet">
      <div class="namebar">
        <span class="eyebrow">Hero name</span>
        <div class="row"><input id="hname" value="${esc(h.name)}" maxlength="40" aria-label="Hero name" ${inAdv?'disabled':''}><button class="btn" id="newName" type="button" ${inAdv?'disabled':''}>New name</button></div>
        <div class="subline">Level ${h.lvl} ${RACE_SV[h.race].toLowerCase()} ${CLS_SV[h.cls].toLowerCase()}</div>
      </div>
      <div class="choose">
        <label for="selRace">Race<select id="selRace" ${inAdv?'disabled':''}>${Object.keys(RACE_SV).map(k=>`<option value="${k}" ${k===h.race?'selected':''}>${RACE_SV[k]}</option>`).join('')}</select></label>
        <label for="selCls">Class<select id="selCls" ${inAdv?'disabled':''}>${Object.keys(CLS_SV).map(k=>`<option value="${k}" ${k===h.cls?'selected':''}>${CLS_SV[k]}</option>`).join('')}</select></label>
      </div>
      <div class="block">
        <div class="log-head"><span class="eyebrow">Abilities · 4d6, drop the lowest</span></div>
        <div class="abil">${abil}</div>
        <div class="muted" style="font-size:14px">The rolls are placed where a ${CLS_SV[h.cls].toLowerCase()} needs them most (gold border). The green number is the racial bonus.</div>
      </div>
      <div class="vitals">
        <div><b>${h.hpMax}</b><span>Hit points</span></div>
        <div><b>${ac(h)}</b><span>Armor class</span></div>
        <div><b>d${c.hd}</b><span>Hit die</span></div>
        <div><b>${r.sp}</b><span>Speed (ft)</span></div>
      </div>
      <div class="gen-actions">
        <button class="btn" id="reroll" type="button" ${inAdv?'disabled':''}>Roll abilities</button>
        <button class="btn" id="randAll" type="button" ${inAdv?'disabled':''}>Randomize all</button>
        <span style="flex:1"></span>
        <button class="btn primary" id="goAdv" type="button">${inAdv?'Continue the adventure':'Enter the cave'}</button>
      </div>
      ${inAdv?`<div class="muted" style="font-size:14px">Your hero is on an adventure. End the adventure in the cave to change the hero.</div>`:''}
    </section>
    <aside class="sheet gen-side" aria-label="Gear and features">
      <div class="block"><h3>Weapons</h3>${weapons}${armor}</div>
      ${spells}
      <div class="block"><h3>Features</h3>${feats}</div>
      <div class="block"><h3>Pack</h3><div class="line"><span>Potion of Healing</span><code>${h.potions} × 2d4+2</code></div><div class="line"><span>Gold</span><code>${h.gold} gp</code></div></div>
    </aside>
  </div>`;
  const nm=document.getElementById('hname');
  nm.oninput=()=>{hero.name=nm.value.trim()||'Nameless';save()};
  document.getElementById('newName').onclick=()=>{hero.name=`${pick(NAMES)} ${pick(EPI)}`;save();render()};
  document.getElementById('selRace').onchange=e=>{hero=newHero({name:hero.name,cls:hero.cls,race:e.target.value,rolls:hero.rolls});save();render()};
  document.getElementById('selCls').onchange=e=>{hero=newHero({name:hero.name,race:hero.race,cls:e.target.value,rolls:hero.rolls});save();render()};
  document.getElementById('reroll').onclick=async()=>{if(LOCK)return;LOCK=true;try{const rolls=await rollAbilityTray();hero=newHero({name:hero.name,race:hero.race,cls:hero.cls,rolls});save();render()}finally{LOCK=false}};
  document.getElementById('randAll').onclick=()=>{hero=newHero();save();render()};
  document.getElementById('goAdv').onclick=()=>{if(!inAdv)startAdventure();setView('adv')};
}

/* ---------- Adventure: rooms ---------- */
const DEPTH=8;
/* Each hint can lead to several kinds of room. The weights set how likely each room is. */
const HINTS=[
  {h:'You hear scraping and heavy footsteps.',o:{fight:5,sleeper:3,traveler:2}},
  {h:'Something glints in the dark.',o:{treasure:3,guarded:3,trap:2,chest:2}},
  {h:'It smells of smoke and roasting meat.',o:{camp:4,merchant:2,fight:2,guarded:2}},
  {h:'It is far too quiet.',o:{trap:3,shrine:2,sleeper:3,treasure:2}},
  {h:'Water trickles somewhere.',o:{well:4,fight:3,shrine:3}},
  {h:'You hear someone whispering.',o:{traveler:3,merchant:3,fight:4}},
  {h:'A cold wind blows through the passage.',o:{fight:3,shrine:3,chest:2,trap:2}},
  {h:'Claw marks run along the wall.',o:{guarded:3,sleeper:3,fight:3,treasure:1}},
  {h:'A faint light flickers ahead.',o:{camp:3,shrine:2,merchant:2,trap:3}},
  {h:'It smells of mold and old bones.',o:{fight:4,chest:2,trap:2,treasure:2}}
];
const KNOWN={fight:'An enemy waits, awake and hungry.',guarded:'A monster guards something valuable.',treasure:'Nothing alive. Only things.',trap:'Something mechanical clicks. A trap.',camp:'An abandoned campsite.',merchant:'Someone is counting coins and humming.',traveler:'Someone is groaning in pain.',sleeper:'Something big is snoring.',shrine:'A holy, silent room.',chest:'A locked chest.',well:'A well.'};
function wpick(o){const t=Object.values(o).reduce((a,b)=>a+b,0);let r=Math.random()*t;for(const k in o){r-=o[k];if(r<=0)return k}return Object.keys(o)[0]}
function crRange(l,boss){if(boss)return l<=1?[0.5,1]:l===2?[1,1]:[l-2,l-1];return [[0.125,0.5],[0.25,1],[0.5,2],[1,3]][l-1]||[l-3,l-1]}
function pickMonster(l,boss,opt){
  opt=opt||{};let [lo,hi]=crRange(l+(opt.bump||0),boss);
  if(!boss&&adv&&adv.chapter===1&&adv.depth<=2){hi=Math.min(hi,opt.bump?0.5:0.25);lo=Math.min(lo,hi)}
  let pool=M.filter(m=>m.cr>=lo&&m.cr<=hi);
  if(boss){const fav=pool.filter(m=>['dragon','giant','fiend','monstrosity','undead','aberration'].includes(m.t));if(fav.length)pool=fav}
  if(opt.type){const f=pool.filter(m=>m.t===opt.type);pool=f.length?f:M.filter(m=>m.t===opt.type&&m.cr<=hi)}
  if(!pool.length)pool=M.filter(m=>m.cr<=hi);
  return pick(pool);
}
function makeDoors(){
  if(adv.depth===DEPTH)return null;
  const r=Math.random(),n=r<.22?1:r<.75?2:3;
  return HINTS.slice().sort(()=>Math.random()-.5).slice(0,n).map(x=>({hint:x.h,t:wpick(x.o)}));
}
function startAdventure(){
  hero.hp=hero.hpMax;resetRest(hero,true);hero.bless=0;hero.curse=0;
  hero.start=JSON.parse(JSON.stringify({...hero,start:undefined}));
  adv={v:3,chapter:1,depth:1,phase:'doors',doors:null,log:[],kills:0,xpGain:0,foe:null,room:null,listened:false};
  adv.doors=makeDoors();
  log('sep',`Chapter 1 · The Cave under Crowpeak`);
  log('note',`${you()} lights a torch and steps into the cave.`,'·');
  save();
}
function you(){return `<b class="you">${esc(hero.name.split(' ')[0])}</b>`}
function them(){return `<b class="them">${esc(adv.foe.m.n)}</b>`}
function log(cls,html,chip,chipCls){adv.log.push({c:cls,h:html,ch:chip,cc:chipCls});if(adv.log.length>160)adv.log.splice(0,adv.log.length-160)}
async function check(ab,dc,profFor,title,extra){
  const st=scores(hero);const trained=!!(profFor&&profFor.includes(hero.cls));let b=mod(st[ab])+(extra||0);if(trained)b+=prof(hero.lvl);
  const r=await heroD20({kind:`${AB_SV[ab]} check`,title,sub:`d20 ${sgn(b)}${trained?' (your class is trained in this)':''} · you need <b>${dc}</b> or more`,flat:b,tone:'check',judge:judgeDc(dc)});
  return{r,b,tot:r+b,ok:r+b>=dc,dc,txt:`<span class="muted">${r}${sgn(b)} = ${r+b} vs ${dc}</span>`};
}
const cdc=base=>base+Math.floor(adv.depth/3)+adv.chapter-1;

async function listen(){
  if(adv.listened)return;adv.listened=true;render();
  const bonus=hero.race==='elf'?2:0;const c=await check('wis',cdc(12),['ranger','rogue','druid','monk'],'Listen at the doors',bonus);
  if(c.ok){adv.doors.forEach(x=>x.known=true);log('',`${you()} presses an ear to the stone and listens ${c.txt}${bonus?' <span class="muted">(+2 elven ears)</span>':''}. Now you know what awaits.`,c.r,'hit')}
  else if(Math.random()<.4){log('',`${you()} listens ${c.txt}, but something hears you first!`,c.r,'fail');adv.room={t:'fight'};log('sep',`Depth ${adv.depth} of ${DEPTH} · Ambush`);await startFight(pickMonster(hero.lvl,false),{foeFirst:true,intro:'Something rushes out of the shadows'});return}
  else log('',`${you()} listens ${c.txt} but hears only their own heartbeat.`,c.r,'');
  save();render();
}
async function startFight(m,opt){
  opt=opt||{};adv.foe={m,hp:m.hp,charged:!!m.sv,first:true,asleep:!!opt.asleep};adv.phase='fight';adv.rage=false;
  log('note',`${opt.intro||'Something steps out of the darkness'}: ${them()}, ${SIZE[m.s]} ${TYPE[m.t]||m.t}.`,'!','fail');
  save();render();
  if(opt.asleep){log('note',`${them()} is asleep. Your first attack is sure to hit.`,'z','heal')}
  else if(opt.foeFirst){log('note',`${them()} goes first!`,'·');adv.busy=true;render();await monsterTurn();adv.busy=false}
  else{
    const fi=d(20)+mod(m.st[1]),dm=mod(scores(hero).dex);
    const r=await heroD20({kind:'Initiative',title:'Roll initiative!',sub:`Who acts first? d20 ${sgn(dm)} (Dexterity) · the ${esc(m.n)} rolled <b>${fi}</b>`,flat:dm,tone:'init',judge:x=>x.total>=fi?{txt:'You go first!',cls:'good'}:{txt:`The ${esc(m.n)} goes first`,cls:'bad'}});
    const ini=r+dm;log('note',`Initiative: ${you()} ${ini}, ${them()} ${fi}.`,'INI');
    if(fi>ini){log('note',`${them()} goes first!`,'·');adv.busy=true;render();await monsterTurn();adv.busy=false}
  }
  if(hero.hp<=0)die();
  save();render();
}
async function enterRoom(idx){
  const door=idx==='boss'?{t:'boss'}:adv.doors[+idx];const t=adv.depth===DEPTH?'boss':door.t;
  adv.room={t};
  log('sep',`Depth ${adv.depth} of ${DEPTH}${t==='boss'?' · The Boss':''}`);
  if(t==='boss'){await startFight(pickMonster(hero.lvl,true),{intro:'The master of the cave rises'});return}
  if(t==='fight'){await startFight(pickMonster(hero.lvl,false));return}
  if(t==='guarded'){adv.room.afterLoot=true;log('note',`Behind a pile of bones stands a chest. Something is guarding it.`,'¤');await startFight(pickMonster(hero.lvl,false,{bump:Math.random()<.4?1:0}),{intro:'The guardian turns toward you'});return}
  if(t==='treasure'){adv.room.loot=rollLoot();adv.phase='room';log('note',`${you()} finds a treasure chest.`,'¤','heal')}
  else if(t==='trap'){
    adv.phase='room';adv.room.done=true;save();render();
    const c=await check('dex',cdc(12),['rogue','monk'],'Tiles click underfoot! Dodge!');
    if(c.ok)log('',`Tiles click underfoot! ${you()} dives aside ${c.txt}. Made it!`,c.r,'hit');
    else{const dm=roll(`${Math.max(1,hero.lvl)+adv.chapter}d6`);hurtHero(dm);adv.shake='hero';log('',`Spears shoot out of the wall! ${you()} is too slow ${c.txt}. <span class="dmg">${dm} damage</span>.`,c.r,'fail')}
    if(hero.hp<=0)die();
  }
  else if(t==='sleeper'){adv.room.m=pickMonster(hero.lvl,false,{bump:1});adv.phase='room';log('note',`A big animal... no, a ${esc(adv.room.m.n)} is sleeping in the middle of the passage.`,'z')}
  else if(t==='chest'){adv.phase='room';adv.room.tries=0;log('note',`An iron-bound chest with a heavy lock.`,'¤')}
  else if(t==='shrine'){adv.phase='room';log('note',`An old altar to a forgotten god.`,'†','magic')}
  else if(t==='traveler'){adv.phase='room';log('note',`A wounded adventurer sits slumped against the wall.`,'?')}
  else if(t==='merchant'){adv.phase='room';log('note',`A gnome merchant with a creaking cart greets you cheerfully.`,'¤','heal')}
  else adv.phase='room';
  save();render();
}
function rollLoot(rich){
  const out=[];const g=roll('2d10')*hero.lvl+adv.chapter*5+(rich?10*hero.lvl:0);out.push({k:'gold',n:`${g} gold pieces`,v:g});
  const items=rich?2:1;
  for(let i=0;i<items;i++){
    const r=Math.random();
    if(r<.42)out.push({k:'pot',n:'Potion of Healing',sv:''});
    else if(r<.57)out.push({k:'gpot',n:'Potion of Greater Healing',sv:''});
    else if(r<.72&&hero.wb<3)out.push({k:'wb',n:`Weapon +${hero.wb+1}`,sv:'magic weapon'});
    else if(r<.84&&hero.acb<2)out.push({k:'acb',n:hero.acb?'Cloak of Protection':'Ring of Protection',sv:'+1 armor class'});
    else out.push({k:'xp',n:'An old map full of clues',v:30*hero.lvl});
  }
  return out;
}
function applyLoot(list){for(const it of list){if(it.k==='gold')hero.gold+=it.v;else if(it.k==='pot')hero.potions++;else if(it.k==='gpot')hero.greater++;else if(it.k==='wb'){if(hero.wb<3){hero.wb++;hero.items=hero.items.filter(x=>!/^Weapon \+/.test(x));hero.items.push(`Weapon +${hero.wb}`)}}else if(it.k==='acb'){if(hero.acb<2){hero.acb++;hero.items.push(it.n)}}else if(it.k==='xp')gainXp(it.v)}}
function takeLoot(){applyLoot(adv.room.loot);log('',`${you()} packs up: ${adv.room.loot.map(i=>i.n).join(', ')}.`,'¤','heal');adv.room.done=true;save();render()}

/* Campsite: sleep deeply (more healing, ambush risk) or lightly (less healing, no risk) */
async function restFull(){
  const b=hero.hp;hero.hp=Math.min(hero.hpMax,hero.hp+Math.max(1,Math.ceil(hero.hpMax/2)));resetRest(hero,false);
  let extra='';if(CL[hero.cls].sa&&hero.cls!=='warlock'&&hero.slots<slotsFor(hero)){hero.slots++;extra=', one spell slot back'}
  log('',`${you()} falls asleep by the fire. <span class="heal">+${hero.hp-b} HP</span>${extra}. Features recharged.`,'z','heal');
  adv.room.done=true;
  if(Math.random()<.35){log('',`But the smoke drew something in! ${you()} wakes with a start.`,'!','fail');await startFight(pickMonster(hero.lvl,false),{foeFirst:true,intro:'A night ambush'});return}
  save();render();
}
function restLight(){
  const b=hero.hp;hero.hp=Math.min(hero.hpMax,hero.hp+Math.max(1,Math.ceil(hero.hpMax/4)));hero.curse=0;
  log('',`${you()} rests with one eye open. <span class="heal">+${hero.hp-b} HP</span>. No features recharge.`,'z','heal');
  adv.room.done=true;save();render();
}
async function drinkWell(){
  const r=Math.random();
  if(r<.45){const h=roll('2d8')+hero.lvl;const b=hero.hp;hero.hp=Math.min(hero.hpMax,hero.hp+h);log('',`The water is clear and fresh. <span class="heal">+${hero.hp-b} HP</span>.`,'~','heal')}
  else if(r<.7){log('',`A spring of wisdom! Visions of old battles flicker past.`,'~','magic');gainXp(40*hero.lvl)}
  else if(r<.85){const dm=roll(`${hero.lvl}d4`);hurtHero(dm);log('',`Bitter! The water was poisoned. <span class="dmg">${dm} damage</span>.`,'~','fail');if(hero.hp<=0)die()}
  else{adv.room.done=true;log('',`The water starts to bubble. A creature rises out of the well!`,'~','fail');await startFight(pickMonster(hero.lvl,false,{type:Math.random()<.5?'elemental':'ooze'}),{foeFirst:true,intro:'Out of the well'});return}
  adv.room.done=true;save();render();
}
/* Sleeping monster */
async function sneakPast(){
  const m=adv.room.m;const c=await check('dex',cdc(11),['rogue','monk','ranger'],`Sneak past the ${m.n}`);
  if(c.ok){log('',`${you()} sneaks past ${c.txt}. The ${esc(m.n)} keeps snoring.`,c.r,'hit');gainXp(15*hero.lvl);adv.room.done=true;save();render()}
  else{log('',`A pebble rattles ${c.txt}. The ${esc(m.n)} wakes up!`,c.r,'fail');await startFight(m,{foeFirst:true,intro:'It wakes'})}
}
function ambushSleeper(){return startFight(adv.room.m,{asleep:true,intro:'You creep up on'})}
/* Locked chest */
async function forceChest(){
  const c=await check('str',cdc(13),['barbarian','fighter','paladin'],'Force the chest open');adv.room.tries++;
  if(c.ok){adv.room.loot=rollLoot(true);log('',`${you()} pries the lid open ${c.txt}!`,c.r,'hit');adv.room.t='treasure';adv.phase='room'}
  else{const dm=d(4);hurtHero(dm);log('',`The lock holds ${c.txt}. ${you()} scrapes their knuckles: <span class="dmg">${dm} damage</span>.`,c.r,'fail');if(hero.hp<=0){die()}}
  save();render();
}
async function pickChest(){
  const c=await check('dex',cdc(13),['rogue'],'Pick the lock');
  if(c.ok)log('',`Click! ${you()} picks the lock ${c.txt}.`,c.r,'hit');
  else{const dm=roll(`${hero.lvl}d6`);const v=resist('poison')?Math.floor(dm/2):dm;hurtHero(v);log('',`A poison needle jabs out of the lock ${c.txt}! <span class="dmg">${v} damage</span>. But the lid swings open.`,c.r,'fail')}
  adv.room.loot=rollLoot(true);adv.room.t='treasure';if(hero.hp<=0)die();save();render();
}
/* Altar */
function bless(){const r=Math.random();
  if(r<.5){hero.hp=hero.hpMax;hero.slots=slotsFor(hero);log('',`A warm light fills the room. ${you()} is fully healed.`,'†','heal')}
  else{hero.bless=1;log('',`The god's blessing! <b>+1 to hit</b> for the rest of the chapter.`,'†','magic')}}
async function pray(){
  const c=await check('wis',cdc(12),['cleric','paladin','druid'],'Pray to the god');
  if(c.ok){log('',`${you()} kneels and prays ${c.txt}.`,c.r,'magic');bless()}
  else{const dm=roll(`${hero.lvl}d4`);hero.hp=Math.max(1,hero.hp-dm);hero.curse=1;log('',`The god is angry ${c.txt}! <span class="dmg">${dm} damage</span> and <b>-1 armor class</b> until you rest.`,c.r,'fail')}
  adv.room.done=true;save();render();
}
function offer(){const cost=15*hero.lvl;if(hero.gold<cost)return;hero.gold-=cost;log('',`${you()} places ${cost} gold on the altar.`,'¤');bless();adv.room.done=true;save();render()}
/* Wounded adventurer */
async function givePotion(){
  if(!hero.potions)return;hero.potions--;
  if(Math.random()<.22){log('',`She drinks, smiles and draws a knife. It was a trap!`,'!','fail');adv.room.done=true;await startFight(pickMonster(hero.lvl,false,{type:'humanoid'}),{foeFirst:true,intro:'The bandit'});return}
  const reward=rollLoot(false).filter(x=>x.k!=='pot');applyLoot(reward);gainXp(30*hero.lvl);adv.nextKnown=true;
  log('',`She thanks you and gives you ${reward.map(x=>x.n).join(' and ')}. She also tells you what waits at the next crossroads.`,'♥','heal');
  adv.room.done=true;save();render();
}
async function talk(){
  const c=await check('cha',cdc(12),['bard','warlock','sorcerer','paladin'],'Talk to the stranger');
  if(c.ok){adv.nextKnown=true;log('',`${you()} talks calmly with her ${c.txt}. She whispers what waits at the next crossroads.`,c.r,'hit')}
  else log('',`She doesn't trust you ${c.txt} and turns her head away.`,c.r,'');
  adv.room.done=true;save();render();
}
/* Merchant */
function shopList(){return [
  {k:'pot',n:'Potion of Healing',sv:'',p:25},
  {k:'gpot',n:'Potion of Greater Healing',sv:'',p:60},
  hero.wb<3?{k:'wb',n:`Hone weapon to +${hero.wb+1}`,p:120*(hero.wb+1)}:null,
  hero.acb<2?{k:'acb',n:hero.acb?'Cloak of Protection':'Ring of Protection',sv:'+1 armor class',p:150*(hero.acb+1)}:null
].filter(Boolean)}
function buy(k){const it=shopList().find(x=>x.k===k);if(!it||hero.gold<it.p)return;hero.gold-=it.p;applyLoot([it]);log('',`${you()} buys ${it.n} for ${it.p} gold.`,'¤','heal');save();render()}
function nextRoom(){
  if(adv.phase==='won'){adv.chapter++;adv.depth=1;hero.hp=hero.hpMax;resetRest(hero,true);hero.bless=0;log('sep',`Chapter ${adv.chapter} · Deeper down`);log('note',`${you()} is fully rested and finds a stair leading deeper into the mountain.`,'·')}
  else adv.depth++;
  adv.phase='doors';adv.room=null;adv.foe=null;adv.listened=false;adv.doors=makeDoors();
  if(adv.nextKnown&&adv.doors){adv.doors.forEach(x=>x.known=true);adv.nextKnown=false;adv.listened=true}
  save();render();
}

/* ---------- Dice tray: the player rolls ---------- */
let AUTO=false;try{AUTO=localStorage.getItem('hg-auto')==='1'}catch(e){}
function setAuto(v){AUTO=!!v;try{localStorage.setItem('hg-auto',AUTO?'1':'0')}catch(e){}const cb=document.getElementById('trayAuto');if(cb)cb.checked=AUTO}
let trayEl=null,hideT=null;
function trayInit(){
  const w=document.createElement('div');

const D20SVG=`<svg viewBox="0 0 100 100" aria-hidden="true"><polygon class="o" points="50,3 91,26.5 91,73.5 50,97 9,73.5 9,26.5"/><polygon class="f1" points="50,3 91,26.5 50,24"/><polygon class="f2" points="91,73.5 50,97 75,70"/><polygon class="in" points="50,24 75,70 25,70"/><path class="ln" d="M50 3 50 24 M91 26.5 50 24 M9 26.5 50 24 M91 26.5 75 70 M9 26.5 25 70 M91 73.5 75 70 M9 73.5 25 70 M50 97 75 70 M50 97 25 70 M50 3 91 26.5 91 73.5 50 97 9 73.5 9 26.5Z"/></svg>`;
function dieHtml(s,v,drop){return s===20?`<span class="die d20">${D20SVG}<b>${v}</b></span>`:`<span class="die ${drop?'drop':''}"><b>${v}</b><i>d${s}</i></span>`}
/* o: {title, sub, kind, tone, groups:[{n,s}], flat, d20, lucky, onLucky, judge(r)->{txt,cls}, layout:'abil'} */
function rollDice(o){
  const sides=[];o.groups.forEach(g=>{for(let i=0;i<g.n;i++)sides.push(g.s)});
  const doRoll=()=>sides.map(s=>d(s));
  const fin=v=>({vals:v,nat:o.d20?v[0]:0,total:v.reduce((a,b)=>a+b,0)+(o.flat||0)});
  if(AUTO||!trayEl){let v=doRoll();if(o.d20&&o.lucky&&v[0]===1){v=doRoll();o.onLucky&&o.onLucky(v[0])}return Promise.resolve(fin(v))}
  return new Promise(resolve=>{
    clearTimeout(hideT);trayEl.hidden=false;document.body.classList.add('tray-open');trayEl.dataset.tone=o.tone||'';
    const $=id=>document.getElementById(id),diceEl=$('trayDice'),resEl=$('trayRes'),btn=$('trayBtn');
    $('trayKind').textContent=o.kind||'Your roll';$('trayTitle').textContent=o.title||'Roll';$('traySub').innerHTML=o.sub||'';
    let state='ready',vals=sides.map(()=>'?'),luckUsed=false,autoT=null,result=null;
    const dropIdx=v=>{if(o.layout!=='abil')return[];const out=[];for(let r=0;r<6;r++){const row=v.slice(r*4,r*4+4);if(row.includes('?'))continue;out.push(r*4+row.indexOf(Math.min(...row)))}return out};
    const paint=cls=>{
      const dr=dropIdx(vals);
      if(o.layout==='abil'){let h='';for(let r=0;r<6;r++){const row=vals.slice(r*4,r*4+4);const ok=!row.includes('?');const t=ok?row.reduce((a,b)=>a+b,0)-Math.min(...row):'';h+=`<span class="drow">${row.map((v,i)=>dieHtml(6,v,dr.includes(r*4+i))).join('')}<b class="rt">${ok?'= '+t:''}</b></span>`}diceEl.innerHTML=h}
      else diceEl.innerHTML=sides.map((s,i)=>dieHtml(s,vals[i],false)).join('');
      diceEl.className='tray-dice '+(o.layout==='abil'?'abil ':'')+(cls||'');
    };
    paint('ready');resEl.innerHTML=`<div class="hint">Tap the ${sides.length>1?'dice':'die'} to roll</div>`;btn.textContent=sides.length>1?'Roll the dice':'Roll the die';
    const close=()=>{clearTimeout(autoT);btn.onclick=diceEl.onclick=null;trayEl.querySelector('.tray-back').onclick=null;hideT=setTimeout(()=>{trayEl.hidden=true;document.body.classList.remove('tray-open')},90);resolve(result)};
    const show=()=>{
      if(o.d20&&o.lucky&&vals[0]===1&&!luckUsed){luckUsed=true;paint('done nat1');resEl.innerHTML=`<div class="verdict crit">Natural 1… but halfling luck!</div><div class="sum">You may roll again.</div>`;o.onLucky&&o.onLucky();state='ready';btn.textContent='Roll again';return}
      result=fin(vals);const nat=result.nat;if(!reduced)soundLand(o.d20&&nat===20);
      paint('done'+(o.d20&&nat===20?' nat20':o.d20&&nat===1?' nat1':''));
      const j=o.judge?o.judge(result):null;const f=o.flat||0;
      const sum=o.layout==='abil'?'4d6 for each ability, the faded die is dropped':o.d20?`${nat} ${f?`${f<0?'−':'+'} ${Math.abs(f)} = <b>${result.total}</b>`:''}`:`${vals.join(' + ')}${f?` ${f<0?'−':'+'} ${Math.abs(f)}`:''} = <b>${result.total}</b>`;
      resEl.innerHTML=`<div class="sum">${sum}</div>${j?`<div class="verdict ${j.cls}">${j.txt}</div>`:''}`;
      btn.textContent='Continue';state='done';autoT=setTimeout(close,holdMs(o.layout==='abil'));
    };
    const go=()=>{
      if(state==='ready'){state='rolling';resEl.innerHTML='<div class="hint">Rolling…</div>';
        if(reduced){vals=doRoll();soundLand(false);show();return}
        soundRoll(rollMs());const iv=setInterval(()=>{vals=doRoll();paint('rolling')},60);
        setTimeout(()=>{clearInterval(iv);vals=doRoll();show()},rollMs())}
      else if(state==='done')close();
    };
    btn.onclick=go;diceEl.onclick=go;trayEl.querySelector('.tray-back').onclick=()=>{if(state==='done')close()};
    setTimeout(()=>{try{btn.focus({preventScroll:true})}catch(e){}},40);
  });
}
async function heroD20(o){
  const r=await rollDice(Object.assign({kind:'d20 roll',groups:[{n:1,s:20}],d20:true,lucky:hero.race==='halfling',onLucky:()=>log('note',`Halfling luck! The 1 is rerolled.`,'↻')},o));
  return r.nat;
}
/* parts: dice strings like '1d8' or '2d6+3'; returns {total, sums:[per part]} */
async function rollDmg(o){
  const groups=[];let flat=o.flat||0;
  for(const p of o.parts){const q=parse(p);if(q.n)groups.push({n:o.crit?q.n*2:q.n,s:q.s});flat+=q.k}
  if(!groups.length)return{total:Math.max(0,flat),sums:[]};
  const r=await rollDice({kind:o.kind||(o.tone==='heal'?'Healing':'Damage'),title:o.title,sub:o.sub,tone:o.tone||'dmg',groups,flat,judge:x=>o.tone==='heal'?{txt:`+${Math.max(0,x.total)} HP`,cls:'good'}:{txt:`${Math.max(0,x.total)} damage!`,cls:'crit'}});
  let i=0;const sums=groups.map(g=>{let s=0;for(let k=0;k<g.n;k++)s+=r.vals[i++];return s});
  return{total:Math.max(0,r.total),sums};
}
const judgeAtk=ac=>x=>x.nat===20?{txt:'Natural 20! Critical hit!',cls:'crit'}:x.nat===1?{txt:'Natural 1. Miss!',cls:'bad'}:x.total>=ac?{txt:'Hit!',cls:'good'}:{txt:'Miss',cls:'bad'};
const judgeDc=(dc,okTxt,badTxt)=>x=>x.total>=dc?{txt:okTxt||'Success!',cls:'good'}:{txt:badTxt||'Failed',cls:'bad'};
async function rollAbilityTray(){
  const r=await rollDice({kind:'Ability scores',title:'Roll your abilities',sub:'Six rolls of 4d6. The lowest die in each row is dropped.',tone:'',groups:[{n:24,s:6}],layout:'abil'});
  const out=[];for(let k=0;k<6;k++){const row=r.vals.slice(k*4,k*4+4);const lo=row.indexOf(Math.min(...row));out.push({r:row,lo,t:row.reduce((a,b)=>a+b,0)-row[lo]})}
  return out;
}

/* Dice sound: a short rattle while rolling, a clack when the die lands */
let AC=null;
function audio(){if(!SET.sound)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function clack(ctx,t,vol,freq){
  const len=Math.floor(ctx.sampleRate*.05),buf=ctx.createBuffer(1,len,ctx.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);
  const src=ctx.createBufferSource();src.buffer=buf;const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=3;
  const g=ctx.createGain();g.gain.value=vol;src.connect(f);f.connect(g);g.connect(ctx.destination);src.start(t);
}
function soundRoll(ms){const ctx=audio();if(!ctx)return;const t0=ctx.currentTime;const n=Math.max(4,Math.round(ms/70));for(let i=0;i<n;i++)clack(ctx,t0+i*(ms/1000)/n+Math.random()*.02,.18+Math.random()*.12,1800+Math.random()*1600)}
function soundLand(big){const ctx=audio();if(!ctx)return;const t=ctx.currentTime;clack(ctx,t,.5,900);clack(ctx,t+.06,.25,1400);
  if(big){const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(660,t+.05);o.frequency.exponentialRampToValueAtTime(1320,t+.35);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+.6);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.65)}}

function openSettings(){if(!setEl||LOCK)return;renderSettings();setEl.hidden=false;document.body.classList.add('tray-open');setTimeout(()=>{const x=setEl.querySelector('[aria-checked="true"]');try{x&&x.focus({preventScroll:true})}catch(e){}},40)}

async function onSettingsClick(e){

/* ---------- Combat ---------- */
function resist(type){const r=RC[hero.race];if(hero.race==='dwarf'&&type==='poison')return true;if(hero.race==='tiefling'&&type==='fire')return true;if(hero.dragon&&type===hero.dragon)return true;if(adv.rage&&['bludgeoning','piercing','slashing'].includes(type))return true;return false}
function hurtHero(n){hero.hp=Math.max(0,hero.hp-n);if(hero.hp===0&&hero.race==='half-orc'&&hero.relent){hero.relent=0;hero.hp=1;log('note',`${you()} refuses to fall! Half-orc toughness keeps them standing with 1 HP.`,'!','heal')}}
function foeTypeMod(n,type){const m=adv.foe.m;if(m.im&&m.im.includes(type))return{v:0,note:` <span class="muted">(immune to ${DMG[type]})</span>`};if(m.rs&&m.rs.includes(type))return{v:Math.floor(n/2),note:` <span class="muted">(resists ${DMG[type]}, half damage)</span>`};if(m.vu&&m.vu.includes(type))return{v:n*2,note:` <span class="muted">(vulnerable to ${DMG[type]}!)</span>`};return{v:n,note:''}}
function hitFoe(n){adv.foe.hp=Math.max(0,adv.foe.hp-n);adv.shake='foe'}

async function doAttack(wi){
  const s=wStats(hero,wi),m=adv.foe.m;
  const swing=async(label,title,hitB,dice,dm,type,canSneak)=>{
    if(!adv.foe||adv.foe.hp<=0)return;
    const sl=adv.foe.asleep;adv.foe.asleep=false;let r=0;
    if(sl)log('note',`${them()} was asleep. The attack hits for sure!`,'z','heal');
    else r=await heroD20({kind:'Attack roll',title,sub:`d20 ${sgn(hitB)} · you need <b>${m.ac}</b> to hit (its armor)`,flat:hitB,tone:'atk',judge:judgeAtk(m.ac)});
    const tot=r+hitB,crit=!sl&&r===20,hit=sl||crit||(r!==1&&tot>=m.ac);
    const rTxt=sl?'<span class="muted">asleep</span>':`<span class="muted">${r}${sgn(hitB)} = ${tot} vs ${m.ac}</span>`;
    if(!hit){log('',`${you()} ${label}: ${rTxt}. Miss.`,r,r===1?'fail':'');render();return false}
    const parts=[dice];let sneak=false;if(canSneak&&hero.cls==='rogue'&&!adv.sneakUsed){parts.push(`${Math.ceil(hero.lvl/2)}d6`);sneak=true;adv.sneakUsed=true}
    const rage=adv.rage&&!s.ranged?2:0;const flat=dm+rage;
    const dr=await rollDmg({title:crit?'Critical hit! Roll damage':'Hit! Roll damage',sub:`${dice}${sgn(dm)} ${DMG[type]}${sneak?` + ${parts[1]} sneak attack`:''}${rage?' + 2 rage':''}${crit?' · <b>double dice</b> for a critical hit':''}`,parts,flat,crit,tone:crit?'crit':'dmg'});
    let extra='';if(rage)extra+=' +2 rage';if(sneak)extra+=` +${dr.sums[1]} sneak attack`;
    const t=foeTypeMod(Math.max(1,dr.total),type);hitFoe(t.v);
    log('',`${you()} ${label}: ${rTxt}. ${crit?'<b>Critical hit!</b>':'Hit!'} <span class="dmg">${t.v} damage</span> <span class="muted">(${DMG[type]}${extra})</span>${t.note}.`,sl?'z':r,crit?'crit':'hit');
    render();return true;
  };
  adv.sneakUsed=false;
  await swing(`${s.ranged?'shoots':'attacks'} with the ${esc(s.name.toLowerCase())}`,`${s.ranged?'Shoot':'Attack'} with the ${s.name.toLowerCase()}`,s.hit,s.dice,s.dm,s.type,true);
  if(hero.cls==='monk'&&adv.foe.hp>0){const st=scores(hero),mm=Math.max(mod(st.str),mod(st.dex));await swing('strikes with a fist','Bonus strike with your fist',prof(hero.lvl)+mm,hero.lvl>=5?'1d6':'1d4',mm,'bludgeoning',false)}
  if(hero.cls==='fighter'&&hero.lvl>=5&&adv.foe.hp>0)await swing(`attacks again`,'Extra attack',s.hit,s.dice,s.dm,s.type,false);
  return endHeroTurn();
}
async function doSpell(id){
  const s=SP[id],m=adv.foe.m,sm=spellMod(hero),pb=prof(hero.lvl),nm=esc(sName(id)),name=sName(id);
  if(s.l===1){if(hero.slots<=0)return;hero.slots--}
  if(s.h){const q=parse(s.h.replace('MOD',sgn(sm)).replace('+-','-'));const hr=await rollDmg({kind:'Healing',title:`${name} heals you`,sub:`${q.n}d${q.s}${q.k?sgn(q.k):''} hit points`,parts:[`${q.n}d${q.s}`],flat:q.k,tone:'heal'});
    const b=hero.hp;hero.hp=Math.min(hero.hpMax,hero.hp+Math.max(1,hr.total));log('',`${you()} casts ${nm}. <span class="heal">+${hero.hp-b} HP</span>.`,'✚','heal');return endHeroTurn()}
  const dice=spellDice(hero,s);
  const sl=adv.foe.asleep;adv.foe.asleep=false;
  if(s.at){const hb=pb+sm+(hero.bless||0);let r=20;
    if(!sl)r=await heroD20({kind:'Spell attack',title:`Cast ${name}`,sub:`d20 ${sgn(hb)} · you need <b>${m.ac}</b> to hit`,flat:hb,tone:'magic',judge:judgeAtk(m.ac)});
    const tot=r+hb,crit=!sl&&r===20,hit=sl||crit||(r!==1&&tot>=m.ac);
    if(!hit)log('',`${you()} casts ${nm}: <span class="muted">${r}${sgn(hb)} = ${tot} vs ${m.ac}</span>. Miss.`,r,'magic');
    else{const dr=await rollDmg({title:crit?`Critical! ${name} damage`:`${name} hits! Roll damage`,sub:`${dice} ${DMG[s.t]}${crit?' · <b>double dice</b>':''}`,parts:[dice],crit,tone:'magic'});

async function monsterTurn(){

    if(!plan.length)plan=[m.a.slice().sort((x,y)=>y.d.reduce((s,z)=>s+avg(z[0]),0)-x.d.reduce((s,z)=>s+avg(z[0]),0))[0]];

      let n=0;const parts=[];let res=false;for(const [dc,t] of a.d){let v=roll(dc,crit);if(resist(t)){v=Math.floor(v/2);res=true}n+=v;parts.push(DMG[t]||t)}

    else if(t==='merchant'){stage=`<h2>The Gnome Merchant</h2><p>“Potions, whetstones, rings of protection! All at honest prices, almost.” You have <b>${h.gold} gold</b>.</p><div class="actions">${shopList().map(it=>`<button class="btn" data-act="buy" data-k="${it.k}" ${h.gold<it.p?'disabled':''}>${esc(it.n)}<small>${it.p} gold</small></button>`).join('')}<button class="btn primary" data-act="next">Move on</button></div>`}
    else{const title=adv.fled?'Escaped!':t==='fight'?'Victory Is Yours':t==='trap'?'The Trap':t==='treasure'?'Pockets Full':t==='camp'?'Rested':t==='sleeper'?'Past It':t==='shrine'?'The Altar Falls Silent':t==='traveler'?'She Vanishes into the Dark':'Onward';adv.fled=false;
      stage=`<h2>${title}</h2><p>${t==='fight'&&adv.lastFoe?`The ${esc(adv.lastFoe)} lies defeated on the stone floor.`:'The passage continues down into the dark.'}</p><div class="actions"><button class="btn primary" data-act="next">Go deeper</button>${h.potions&&h.hp<h.hpMax/2?`<button class="btn" data-act="pot">Drink a potion</button>`:''}</div>`}
  }else if(P==='won'){
    stage=`<div class="banner"><span class="big">Chapter ${adv.chapter} complete!</span>${esc(h.name)} defeated the ${esc(adv.lastFoe)} and became the hero of the cave. ${adv.kills} enemies defeated in total.</div><p>Deeper in the mountain there are more passages, and more dangerous monsters. You rest fully before going on.</p><div class="actions"><button class="btn primary" data-act="next">Descend to chapter ${adv.chapter+1}</button><button class="btn" data-act="newone">Create a new hero</button></div>`;
  }else if(P==='dead'){
    stage=`<div class="banner dead"><span class="big">${esc(h.name)} has fallen</span>at depth ${adv.depth} in chapter ${adv.chapter}, level ${h.lvl}, after defeating ${adv.kills} enemies.</div><div class="actions"><button class="btn primary" data-act="retry">Same hero, try again</button><button class="btn" data-act="newone">Create a new hero</button></div>`;
  }
  const logHtml=adv.log.map(e=>e.c==='sep'?`<li class="sep">${e.h}</li>`:`<li class="${e.c}"><span class="chip ${e.cc||''}">${e.ch??'·'}</span><div>${e.h}</div></li>`).join('');
  $view.innerHTML=`<div class="adv">${status}<section class="scene">
    <div class="depth" aria-label="Depth in the cave">${steps}</div>
    <div class="sheet stage">${stage}</div>
    <div><div class="log-head"><h3>Chronicle</h3><span class="lh-btns"><button class="btn dicetog" data-act="dice" type="button" aria-pressed="${!AUTO}">${AUTO?'Dice: auto':'Dice: you roll'}</button><button class="btn" data-act="abandon" type="button" style="font-size:13px;padding:5px 10px">End adventure</button></span></div><ol class="log" id="log">${logHtml}</ol></div>
  </section></div>`;
  const lg=document.getElementById('log');lg.scrollTop=lg.scrollHeight;adv.shake=null;
  const more=document.getElementById('more');if(more&&!wide)more.addEventListener('toggle',()=>{adv.moreOpen=more.open});
  const key=adv.phase+'|'+adv.depth+'|'+adv.chapter+'|'+(adv.room&&adv.room.t);
  if(!wide&&key!==lastKey&&lastKey!==null){const stg=document.querySelector('.stage'),bar=document.querySelector('.status');const top=stg.getBoundingClientRect().top,off=(bar?bar.offsetHeight:0)+12;if(top<off||top>innerHeight*.55)window.scrollTo({top:scrollY+top-off,behavior:reduced?'auto':'smooth'})}
  lastKey=key;
}
$view.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||!adv||b.disabled)return;
  const a=b.dataset.act;
  if(adv.busy&&adv.phase==='fight'&&a!=='abandon'&&a!=='dice')return;
  const fn=({dice:()=>{setAuto(!AUTO);render()},enter:()=>enterRoom(b.dataset.t),atk:()=>doAttack(b.dataset.w),spell:()=>doSpell(b.dataset.s),sw:doSecondWind,rage:doRage,lay:doLay,breath:doBreath,
    pot:()=>doPotion(false),gpot:()=>doPotion(true),flee:doFlee,take:takeLoot,restFull,restLight,well:drinkWell,listen,sneak:sneakPast,ambush:ambushSleeper,force:forceChest,pick:pickChest,pray,offer,give:givePotion,talk,buy:()=>buy(b.dataset.k),next:nextRoom,retry,newone:newOne,
    abandon:()=>{if(b.dataset.confirm){adv=null;hero=hero.start?JSON.parse(JSON.stringify(hero.start)):hero;setView('gen')}else{b.dataset.confirm='1';b.textContent='Sure? Tap again'}}
  })[a];
  if(!fn)return;
  if(a==='abandon'||a==='dice'){fn();return}
  if(LOCK)return;LOCK=true;
  Promise.resolve().then(fn).catch(err=>console.error(err)).finally(()=>{LOCK=false;render()});
});

let lastKey=null,LOCK=false;
function render(){document.body.classList.toggle('in-adv',view==='adv'&&!!adv);if(view==='adv'&&adv)renderAdv();else{lastKey=null;renderGen()}}
document.getElementById('tabGen').setAttribute('aria-selected',String(view==='gen'));document.getElementById('tabAdv').setAttribute('aria-selected',String(view==='adv'));
render();
trayInit();settingsInit();
window.__t={setAuto,doSecondWind,listen,restFull,restLight,sneakPast,ambushSleeper,forceChest,pickChest,pray,offer,givePotion,talk,buy,shopList,doBreath,newHero,startAdventure:()=>{startAdventure()},get hero(){return hero},get adv(){return adv},enterRoom,doAttack,doSpell,nextRoom,takeLoot,drinkWell,doPotion,doFlee,monsterTurn};
})();
</script><script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}))}</script></body></html>
